const DEST_VIBES = {
  goa: ['🌊 Beaches','🍹 Nightlife','🛕 Heritage','🐠 Water Sports'],
  manali: ['🏔️ Mountains','❄️ Snow','🪂 Adventure','🌲 Nature'],
  rajasthan: ['🏰 Palaces','🐪 Desert','🎨 Culture','👑 Royalty'],
  kerala:  ['🌴 Backwaters','🐘 Wildlife','🍃 Ayurveda','🌊 Beaches'],
  agra:    ['🕌 Taj Mahal','🏰 Forts','🎨 Mughal Art','🛕 Heritage'],
  shimla:  ['❄️ Snow','🌲 Forests','🚂 Toy Train','🏔️ Hills'],
  ooty:    ['🍃 Tea Gardens','🚂 Toy Train','🌸 Nilgiris','🌿 Nature'],
  default: ['✨ Explore','📸 Scenic','🍽️ Food','🎭 Culture'],
};
function getDestKey(dest) {
  if (!dest) return 'default';
  const d = dest.toLowerCase();
  return Object.keys(DEST_PHOTOS).find(k => d.includes(k)) || 'default';
}

function VotingScreen({ trip, members, session, sendNotifications }) {
  const [votes, setVotes] = useState([]);
  const [myVotes, setMyVotes] = useState({});
  const [loading, setLoading] = useState(true);
  const [consensus, setConsensus] = useState('');
  const [generating, setGenerating] = useState(false);
  const [photoIdx, setPhotoIdx] = useState(0);
  const [aiOpen, setAiOpen] = useState(false);
  const [aiQ, setAiQ] = useState('');
  const [aiA, setAiA] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const uid = session?.user?.id;

  const destKey = getDestKey(trip.destination);
  const photos = DEST_PHOTOS[destKey] || DEST_PHOTOS.default;
  const vibes = DEST_VIBES[destKey] || DEST_VIBES.default;

  const categories = [
    { id:'transport', label:'🚗 How do we get there?', options:['✈️ Flight','🚂 Train','🚌 Bus','🚗 Self-drive','✈️ Flight + 🚗 Cab','🚂 Train + 🚗 Car'] },
    { id:'hotel', label:'🏨 Where do we stay?', options:['Budget guesthouse (₹500-1000/night)','Mid-range hotel (₹1500-3000/night)','Premium resort (₹4000+/night)','Airbnb/Villa','Hostel/Dorm'] },
    { id:'dates', label:'📅 When do we go?', options:[trip.start_date ? `Planned: ${trip.start_date}` : 'This weekend','Next weekend','Next month','Flexible — whenever works'] },
  ];
  const [customInputs, setCustomInputs] = React.useState({transport:'',hotel:'',dates:''});
  const [prefOpen, setPrefOpen] = React.useState(false);
  const [myPref, setMyPref] = React.useState(() => { try { return JSON.parse(localStorage.getItem('sn_pref_'+trip.id+'_'+uid)||'{}'); } catch(e){return{};} });
  const [allPrefs, setAllPrefs] = React.useState([]);
  const [prefSaved, setPrefSaved] = React.useState(false);

  useEffect(() => { loadVotes(); loadPrefs(); }, [trip.id]);
  useEffect(() => {
    const t = setInterval(() => setPhotoIdx(i => (i+1) % photos.length), 4000);
    return () => clearInterval(t);
  }, [photos.length]);

  async function loadVotes() {
    setLoading(true);
    const { data } = await sb.from('trip_votes').select('*').eq('trip_id', trip.id);
    if (data) {
      setVotes(data);
      const mine = {};
      data.filter(v => v.user_id === uid).forEach(v => { mine[v.category] = v.option_text; });
      setMyVotes(mine);
    }
    setLoading(false);
  }
  async function loadPrefs() {
    const { data } = await sb.from('member_preferences').select('*,profiles(name)').eq('trip_id', trip.id);
    if (data) setAllPrefs(data);
  }
  async function castVote(category, option) {
    setMyVotes(m => ({ ...m, [category]: option }));
    await sb.from('trip_votes').upsert({ trip_id: trip.id, user_id: uid, category, option_text: option }, { onConflict:'trip_id,user_id,category' });
    await loadVotes();
    const myName = members.find(m => m.user_id === uid)?.profiles?.name || 'Someone';
    await sendNotifications(trip.id, members, uid, `${myName} voted for "${option}"`);
  }
  async function savePrefs() {
    try { localStorage.setItem('sn_pref_'+trip.id+'_'+uid, JSON.stringify(myPref)); } catch(e){}
    await sb.from('member_preferences').upsert({ trip_id:trip.id, user_id:uid, budget:myPref.budget||'', dietary:myPref.dietary||'', room:myPref.room||'', note:myPref.note||'' }, { onConflict:'trip_id,user_id' });
    await loadPrefs(); setPrefSaved(true); setTimeout(() => setPrefSaved(false), 2000);
  }
  async function askAI() {
    if (!aiQ.trim()) return;
    setAiLoading(true); setAiA('');
    const ctx = `Trip to ${trip.destination} with ${members.length} people. User asks: ${aiQ}. Answer in 2-3 sentences, be specific and helpful.`;
    try { const r = await callGemini(ctx); setAiA(r); } catch(e) { setAiA('⚠️ AI unavailable — check Groq key in Profile.'); }
    setAiLoading(false);
  }
  async function getAIConsensus() {
    setGenerating(true); setConsensus('');
    const summary = categories.map(cat => {
      const catVotes = votes.filter(v => v.category === cat.id);
      const tally = {};
      catVotes.forEach(v => { tally[v.option_text] = (tally[v.option_text]||0)+1; });
      const top = Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([o,c])=>`${o} (${c} votes)`).join(', ');
      return `${cat.label}: ${top||'No votes yet'}`;
    }).join('\n');
    const prompt = `You are SafarNama AI. Group trip to ${trip.destination} with ${members.length} members.\n\nVote results:\n${summary}\n\nGive a warm 3-sentence recommendation for the best overall plan. Be specific and enthusiastic.`;
    try { const r = await callGemini(prompt); setConsensus(r); } catch(e) { setConsensus('⚠️ '+e.message); }
    setGenerating(false);
  }

  const totalMembers = members.length || 1;
  function votesForOption(cat, opt) { return votes.filter(v => v.category===cat && v.option_text===opt).length; }

  return (
    <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:0,minHeight:'calc(100vh - 120px)'}}>

      {/* ── LEFT: DESTINATION PHOTO ── */}
      <div style={{position:'relative',overflow:'hidden',minHeight:500,background:'#0a1628'}}>
        {photos.map((src,i) => (
          <img key={i} src={src} alt={trip.destination}
            style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',
              opacity: i===photoIdx ? 1 : 0, transition:'opacity 1.2s ease-in-out'}} />
        ))}
        <div style={{position:'absolute',inset:0,background:'linear-gradient(to top, rgba(10,22,40,.8) 0%, rgba(10,22,40,.15) 55%, transparent 100%)'}}/>
        <div style={{position:'absolute',top:0,left:0,right:0,padding:'16px 20px',background:'linear-gradient(to bottom,rgba(10,22,40,.65),transparent)'}}>
          <div style={{fontSize:26,fontWeight:900,color:'#fff',letterSpacing:.5}}>{trip.destination}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.7)',marginTop:3}}>{members.length} travellers · {trip.start_date || 'Dates TBD'}</div>
        </div>
        <div style={{position:'absolute',bottom:64,left:16,display:'flex',gap:6}}>
          {photos.map((_,i) => (
            <button key={i} onClick={() => setPhotoIdx(i)}
              style={{width:i===photoIdx?44:32,height:i===photoIdx?32:24,borderRadius:6,
                border:i===photoIdx?'2px solid #FB923C':'2px solid rgba(255,255,255,.35)',
                background:'rgba(255,255,255,.18)',cursor:'pointer',transition:'all .3s',padding:0,flexShrink:0}} />
          ))}
        </div>
        <div style={{position:'absolute',bottom:18,left:16,right:16,display:'flex',gap:6,flexWrap:'wrap'}}>
          {vibes.map(v => (
            <span key={v} style={{background:'rgba(255,255,255,.16)',backdropFilter:'blur(6px)',color:'#fff',fontSize:11,fontWeight:600,padding:'5px 12px',borderRadius:20,border:'1px solid rgba(255,255,255,.2)'}}>{v}</span>
          ))}
        </div>
        {/* AD_SLOT: position absolute bottom-0, 48px height banner — future monetization */}
      </div>

      {/* ── RIGHT: VOTING PANEL (narrower, warm palette) ── */}
      <div style={{display:'flex',flexDirection:'column',background:'#FAFAF8',overflowY:'auto',maxHeight:'calc(100vh - 120px)',borderLeft:'1px solid #E8E0D8'}}>

        {/* Header — navy */}
        <div style={{background:'linear-gradient(135deg,#0369A1,#0EA5E9)',padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{color:'#fff',fontWeight:800,fontSize:13,letterSpacing:.2}}>🗳️ Cast Your Votes</div>
          <button onClick={() => setAiOpen(o => !o)}
            style={{background: aiOpen ? '#FB923C' : 'rgba(255,255,255,.18)',border:'none',borderRadius:20,padding:'4px 11px',
              color:'#fff',fontSize:11,fontWeight:700,cursor:'pointer',transition:'background .2s'}}>
            {aiOpen ? '✕ AI' : '🤖 AI'}
          </button>
        </div>

        {/* AI panel — warm amber */}
        {aiOpen && (
          <div style={{background:'#EEF2FF',borderBottom:'1px solid #C7D2FE',padding:'10px 14px',flexShrink:0}}>
            <div style={{fontSize:11,fontWeight:700,color:'#1E3A8A',marginBottom:7}}>🤖 AI Travel Assistant</div>
            <div style={{display:'flex',gap:6,marginBottom:7}}>
              <input className="form-input" style={{flex:1,fontSize:12,padding:'6px 9px'}}
                placeholder={`Ask about ${trip.destination}…`}
                value={aiQ} onChange={e => setAiQ(e.target.value)}
                onKeyDown={e => e.key==='Enter' && askAI()} />
              <button className="btn btn-sm" onClick={askAI} disabled={aiLoading}
                style={{background:'#FB923C',color:'#fff',border:'none',whiteSpace:'nowrap',fontSize:11}}>
                {aiLoading ? '⏳' : 'Ask'}
              </button>
            </div>
            {aiA && <div style={{fontSize:11,color:'#1E3A8A',lineHeight:1.6,background:'#fff',padding:'7px 9px',borderRadius:7,border:'1px solid #C7D2FE'}}>{aiA}</div>}
            <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:6}}>
              {[`Best time?`,'What to pack?','Budget tips?'].map(q => (
                <button key={q} onClick={() => setAiQ(`${q.replace('?','')} for ${trip.destination}?`)}
                  style={{fontSize:10,padding:'3px 8px',borderRadius:12,border:'1px solid #C7D2FE',background:'#fff',color:'#1E3A8A',cursor:'pointer'}}>{q}</button>
              ))}
            </div>
          </div>
        )}

        {/* Voting content */}
        <div style={{flex:1,padding:'12px 16px 12px 14px',overflowY:'auto'}}>
          {loading ? <div style={{textAlign:'center',padding:20,color:'var(--muted)'}}>Loading votes…</div> : (
            <>
              {categories.map(cat => {
                const customVotedOpts = votes.filter(v => v.category===cat.id && !cat.options.includes(v.option_text)).map(v => v.option_text).filter((v,i,a)=>a.indexOf(v)===i);
                const allOptions = [...cat.options, ...customVotedOpts];
                return (
                  <div key={cat.id} style={{marginBottom:16}}>
                    <div style={{fontSize:10,fontWeight:800,color:'#6B7280',marginBottom:6,textTransform:'uppercase',letterSpacing:.8}}>{cat.label}</div>
                    <div style={{display:'flex',flexDirection:'column',gap:4}}>
                      {allOptions.map(opt => {
                        const count = votesForOption(cat.id, opt);
                        const pct = Math.round((count/totalMembers)*100);
                        const isMyVote = myVotes[cat.id]===opt;
                        return (
                          <button key={opt} onClick={() => castVote(cat.id, opt)}
                            style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 10px',borderRadius:8,
                              border: isMyVote ? '2px solid #FB923C' : '1px solid #E5E7EB',
                              background: isMyVote ? '#E0F2FE' : '#fff',cursor:'pointer',textAlign:'left',transition:'all .15s',
                              boxShadow: isMyVote ? '0 2px 8px rgba(249,115,22,.12)' : 'none'}}>
                            <div style={{flex:1}}>
                              <div style={{fontSize:12,color:'#1F2937',fontWeight: isMyVote?700:400}}>{opt}</div>
                              {count>0 && (
                                <div style={{display:'flex',alignItems:'center',gap:5,marginTop:3}}>
                                  <div style={{flex:1,height:3,background:'#F3F4F6',borderRadius:2}}>
                                    <div style={{width:pct+'%',height:'100%',background:isMyVote?'#FB923C':'#0D9488',borderRadius:2,transition:'width .3s'}}/>
                                  </div>
                                  <span style={{fontSize:10,color:isMyVote?'#C2410C':'#0D9488',fontWeight:700}}>{count}/{totalMembers}</span>
                                </div>
                              )}
                            </div>
                            {isMyVote && <span style={{marginLeft:6,fontSize:13}}>✅</span>}
                          </button>
                        );
                      })}
                    </div>
                    <div style={{display:'flex',gap:5,marginTop:5}}>
                      <input className="form-input" style={{flex:1,fontSize:11,padding:'5px 8px'}}
                        placeholder="Add option…" value={customInputs[cat.id]||''}
                        onChange={e => setCustomInputs(p=>({...p,[cat.id]:e.target.value}))}
                        onKeyDown={e => { if(e.key==='Enter'&&customInputs[cat.id]?.trim()){castVote(cat.id,customInputs[cat.id].trim());setCustomInputs(p=>({...p,[cat.id]:''}));} }} />
                      <button className="btn btn-sm" style={{fontSize:11,padding:'5px 9px',background:'#F3F4F6',color:'#374151',border:'1px solid #E5E7EB'}}
                        onClick={() => { if(customInputs[cat.id]?.trim()){castVote(cat.id,customInputs[cat.id].trim());setCustomInputs(p=>({...p,[cat.id]:''}));} }}>+ Add</button>
                    </div>
                  </div>
                );
              })}

              {/* Member Preferences */}
              <div style={{borderTop:'1px solid #E5E7EB',paddingTop:10,marginBottom:14}}>
                <button onClick={() => setPrefOpen(o=>!o)} style={{width:'100%',display:'flex',justifyContent:'space-between',alignItems:'center',background:'none',border:'none',cursor:'pointer',padding:'4px 0'}}>
                  <div style={{fontWeight:700,fontSize:10,color:'#6B7280',textTransform:'uppercase',letterSpacing:.8}}>🙋 My Preferences</div>
                  <span style={{color:'#9CA3AF',fontSize:14,transform:prefOpen?'rotate(180deg)':'none',transition:'transform .2s'}}>▾</span>
                </button>
                {prefOpen && (
                  <div style={{marginTop:8}}>
                    <div style={{marginBottom:8}}>
                      <div style={{fontSize:10,color:'#9CA3AF',marginBottom:5,fontWeight:600}}>Budget</div>
                      <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                        {['Tight (₹)','Comfortable (₹₹)','Flexible (₹₹₹)'].map(b => (
                          <button key={b} onClick={()=>setMyPref(p=>({...p,budget:b}))}
                            style={{padding:'4px 9px',borderRadius:14,fontSize:10,border:'1.5px solid',cursor:'pointer',fontWeight:600,
                              borderColor:myPref.budget===b?'#0D9488':'#E5E7EB',background:myPref.budget===b?'#F0FDFA':'#fff',color:myPref.budget===b?'#0D9488':'#6B7280'}}>
                            {b}
                          </button>
                        ))}
                      </div>
                    </div>
                    <input className="form-input" style={{fontSize:11,marginBottom:5}} placeholder="Dietary needs…" value={myPref.dietary||''} onChange={e=>setMyPref(p=>({...p,dietary:e.target.value}))} />
                    <input className="form-input" style={{fontSize:11,marginBottom:8}} placeholder="Room preference…" value={myPref.room||''} onChange={e=>setMyPref(p=>({...p,room:e.target.value}))} />
                    <button style={{width:'100%',fontSize:11,padding:'7px',borderRadius:8,border:'none',cursor:'pointer',fontWeight:700,background:prefSaved?'#0D9488':'#FB923C',color:'#fff',transition:'background .2s'}} onClick={savePrefs}>{prefSaved?'✅ Saved!':'💾 Save Preferences'}</button>
                    {allPrefs.length>0 && (
                      <div style={{marginTop:8}}>
                        <div style={{fontSize:10,fontWeight:700,color:'#9CA3AF',marginBottom:4,textTransform:'uppercase'}}>Group ({allPrefs.length}/{members.length})</div>
                        {allPrefs.map((p,i)=>(
                          <div key={i} style={{fontSize:11,color:'#374151',background:'#fff',borderRadius:6,padding:'5px 8px',marginBottom:3,border:'1px solid #E5E7EB'}}>
                            <strong>{p.profiles?.name||'Member'}:</strong> {[p.budget,p.dietary,p.room].filter(Boolean).join(' · ')||'Not set'}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* AI Consensus */}
              {consensus && (
                <div style={{background:'#F0FDFA',border:'1.5px solid #99F6E4',borderRadius:10,padding:'10px 12px',marginBottom:10}}>
                  <div style={{fontSize:10,fontWeight:800,color:'#065F46',marginBottom:4}}>🤖 AI Recommendation</div>
                  <div style={{fontSize:11,color:'#0F766E',lineHeight:1.6}}>{consensus}</div>
                </div>
              )}
              <button style={{width:'100%',marginBottom:6,fontSize:12,padding:'9px',borderRadius:9,border:'none',cursor:'pointer',fontWeight:700,
                background:'linear-gradient(135deg,#0369A1,#0EA5E9)',color:'#fff'}} onClick={getAIConsensus} disabled={generating}>
                {generating ? '⏳ Analysing votes…' : '🤖 Get AI Consensus'}
              </button>
            </>
          )}
        </div>
      </div>

    </div>
  );
}

    <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:0,minHeight:'calc(100vh - 120px)'}}>

      {/* ── LEFT: ITINERARY ── */}
      <div style={{borderRight:'1px solid #E5E7EB',overflowY:'auto',maxHeight:'calc(100vh - 120px)',background:'#fff'}}>

function ItineraryScreen({ trip, members }) {
  const [itinerary, setItinerary] = useState(null);
  const [loading, setLoading] = useState(true);
  const [generating, setGenerating] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [editText, setEditText] = useState('');
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadItinerary(); }, [trip.id]);

  async function loadItinerary() {
    setLoading(true);
    const { data } = await sb.from('itineraries').select('*').eq('trip_id', trip.id).single();
    if (data) { setItinerary(data.content); setEditText(data.content); }
    setLoading(false);
  }

  async function generateItinerary() {
    setGenerating(true); setEditMode(false);
    const days = trip.start_date && trip.end_date
      ? Math.max(1, Math.round((new Date(trip.end_date) - new Date(trip.start_date)) / 86400000) + 1)
      : 4;
    const prompt = `You are SafarNama AI, an expert Indian travel planner. Create a detailed ${days}-day itinerary for a group of ${members.length} people going to ${trip.destination}${trip.start_date ? ` from ${trip.start_date} to ${trip.end_date}` : ''}.

Format EXACTLY like this for each day:
DAY 1: [Catchy Theme Title with emoji]
08:00 - [Activity name] — [1 sentence description] (₹[cost per person])
12:00 - Lunch at [Restaurant name] — [specialty dish] (₹[cost per person])
14:00 - [Activity] — [description] (₹[cost])
19:00 - Dinner at [Restaurant] — [description] (₹[cost])
21:00 - [Evening plan] — [description] (₹[cost])

End each day with:
💡 Day Tip: [One practical tip for the day]

Include real restaurant names, realistic INR costs, and make it fun for a group!`;
    try {
      const reply = await callGemini(prompt);
      await sb.from('itineraries').upsert({ trip_id: trip.id, content: reply, generated_at: new Date().toISOString() }, { onConflict: 'trip_id' });
      setItinerary(reply); setEditText(reply);
    } catch(e) {
      setItinerary(e.message === 'NO_KEY' ? '⚠️ Add your Groq API key in Profile → AI Settings to generate itinerary.' : `⚠️ Error: ${e.message}`);
    }
    setGenerating(false);
  }

  async function saveEdit() {
    setSaving(true);
    await sb.from('itineraries').upsert({ trip_id: trip.id, content: editText, generated_at: new Date().toISOString() }, { onConflict: 'trip_id' });
    setItinerary(editText); setEditMode(false);
    setSaving(false);
  }

  function parseItinerary(text) {
    if (!text || text.startsWith('⚠️')) return null;
    const days = text.split(/(?=DAY \d+:)/i).filter(s => s.trim().match(/^DAY \d+:/i));
    if (!days.length) return null;
    return days.map((day, i) => {
      const lines = day.trim().split('\n').filter(Boolean);
      const headerLine = lines[0].replace(/^DAY \d+:\s*/i, '');
      const tip = lines.find(l => l.startsWith('💡'));
      const activities = lines.slice(1).filter(l => !l.startsWith('💡')).map(l => {
        const match = l.match(/^(\d{1,2}:\d{2})\s*[-–]\s*(.+)/);
        if (!match) return null;
        const descFull = match[2];
        const costMatch = descFull.match(/(₹[\d,]+(?:[\s\w]*)?)/);
        const rawDesc = descFull.replace(/(\(₹[\d,]+[^)]*\)|₹[\d,]+[\s\w]*)/, '').replace(/\(\s*\)/, '').trim();
        // Split "Activity name — description" on em dash or —
        const splitMatch = rawDesc.match(/^(.+?)(?:\s*[—–-]{1,2}\s*)(.+)$/);
        const name = splitMatch ? splitMatch[1].trim() : rawDesc;
        const desc = splitMatch ? splitMatch[2].trim() : '';
        const hr = parseInt(match[1].split(':')[0]);
        const period = hr < 12 ? 'morning' : hr < 17 ? 'afternoon' : 'evening';
        const isMeal = /breakfast|lunch|dinner|brunch|snack|cafe|restaurant|dhaba/i.test(rawDesc);
        return { time: match[1], name, desc, cost: costMatch ? costMatch[1] : null, period, isMeal };
      }).filter(Boolean);
      // Calculate day date from trip start
      let dateStr = null;
      if (trip.start_date) {
        const d = new Date(trip.start_date);
        d.setDate(d.getDate() + i);
        dateStr = d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
      }
      // Calculate total estimated cost
      const totalCost = activities.reduce((sum, a) => {
        if (!a.cost) return sum;
        const n = parseInt(a.cost.replace(/[₹,\s]/g,''));
        return sum + (isNaN(n) ? 0 : n);
      }, 0);
      return { day: i + 1, title: headerLine, activities, tip: tip ? tip.replace('💡 Day Tip:', '').trim() : null, dateStr, totalCost };
    });
  }

  const parsed = itinerary ? parseItinerary(itinerary) : null;

  const periodStyle = {
    morning:   { dot:'#FB923C', timeBg:'#FFFBEB', timeColor:'#92400E' },
    afternoon: { dot:'#0D9488', timeBg:'#F0FDFA', timeColor:'#0F766E' },
    evening:   { dot:'#6366F1', timeBg:'#EEF2FF', timeColor:'#4338CA' },
  };
  const mealLabel = { breakfast:'🌅 Breakfast', lunch:'☀️ Lunch', dinner:'🌙 Dinner', brunch:'🥞 Brunch' };

  if (loading) return <div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Loading itinerary…</div>;

  return (
    <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div className="sec-title">📋 Trip Itinerary</div>
        <div style={{display:'flex',gap:8}}>
          {itinerary && !itinerary.startsWith('⚠️') && (
            editMode
              ? <>
                  <button className="itin-edit-btn" onClick={() => setEditMode(false)}>✕ Cancel</button>
                  <button className="btn btn-primary btn-sm" onClick={saveEdit} disabled={saving}>{saving ? '⏳' : '💾 Save'}</button>
                </>
              : <button className="itin-edit-btn" onClick={() => { setEditText(itinerary); setEditMode(true); }}>✏️ Edit</button>
          )}
          <button className="btn btn-primary btn-sm" onClick={generateItinerary} disabled={generating}>
            {generating ? '⏳' : itinerary ? '🔄 Regenerate' : '✨ Generate'}
          </button>
        </div>
      </div>

      {!itinerary && !generating && (
        <div className="empty-state" style={{padding:'32px 0'}}>
          <div className="empty-icon">📋</div>
          <div className="empty-title">No itinerary yet</div>
          <div className="empty-sub">Tap Generate to create a beautiful AI day-by-day plan for {trip.destination}</div>
          <button className="btn btn-primary" style={{maxWidth:240,margin:'0 auto'}} onClick={generateItinerary}>✨ Generate AI Itinerary</button>
        </div>
      )}

      {generating && (
        <div style={{textAlign:'center',padding:40}}>
          <div style={{fontSize:40,marginBottom:12}}>🤖</div>
          <div style={{color:'var(--teal)',fontWeight:700}}>AI is crafting your perfect itinerary…</div>
          <div style={{fontSize:13,color:'var(--muted)',marginTop:6}}>Planning activities, restaurants & tips — takes ~15 seconds</div>
        </div>
      )}

      {itinerary && itinerary.startsWith('⚠️') && <div className="err-msg">{itinerary}</div>}

      {editMode && (
        <div>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>Edit the itinerary text below and click Save:</div>
          <textarea className="itin-edit-area" value={editText} onChange={e => setEditText(e.target.value)} />
        </div>
      )}

      {!editMode && parsed && parsed.map(d => (
        <div key={d.day} className="itin-day">
          {/* Day Header */}
          <div className="itin-day-header">
            <div className="itin-day-date-row">
              <span className="itin-day-badge">Day {d.day}</span>
              {d.dateStr && <span className="itin-day-datestr">📅 {d.dateStr}</span>}
            </div>
            <div className="itin-day-title">{d.title}</div>
            <div className="itin-day-meta">
              <span className="itin-day-meta-pill">🗓️ {d.activities.length} stops</span>
              {d.totalCost > 0 && <span className="itin-day-meta-pill">💰 ~₹{d.totalCost.toLocaleString('en-IN')} est.</span>}
            </div>
          </div>

          {/* Timeline */}
          <div className="itin-timeline">
            {d.activities.map((a, i) => {
              const ps = periodStyle[a.period] || periodStyle.morning;
              const mealKey = Object.keys(mealLabel).find(k => a.name.toLowerCase().includes(k) || a.desc.toLowerCase().includes(k));
              return (
                <div key={i} className="itin-slot" style={{position:'relative'}}>
                  {/* Vertical connector line */}
                  {i < d.activities.length - 1 && (
                    <div style={{position:'absolute',left:18,top:26,width:2,bottom:-10,background:'#E8EDF5',zIndex:0}}/>
                  )}
                  {/* Dot */}
                  <div className="itin-slot-marker">
                    <div className="itin-dot" style={{color:ps.dot,background:ps.dot,width:12,height:12,borderRadius:'50%',border:'2px solid #fff',boxShadow:`0 0 0 2px ${ps.dot}`,zIndex:1}}/>
                  </div>
                  {/* Content */}
                  <div className="itin-slot-body">
                    <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:4}}>
                      <span className="itin-slot-time" style={{background:ps.timeBg,color:ps.timeColor}}>{a.time}</span>
                      {a.isMeal && mealKey && (
                        <span className="itin-meal-badge" style={{background:'#FFF3E0',color:'#E65100'}}>{mealLabel[mealKey]}</span>
                      )}
                    </div>
                    <div className="itin-slot-name">{a.name}</div>
                    {a.desc && <div className="itin-slot-desc">{a.desc}</div>}
                    {a.cost && <span className="itin-slot-cost">{a.cost} per person</span>}
                  </div>
                </div>
              );
            })}
            {d.tip && (
              <div className="itin-tip">
                <strong>💡 Local Tip:</strong> {d.tip}
              </div>
            )}
          </div>
        </div>
      ))}

      {!editMode && itinerary && !parsed && !itinerary.startsWith('⚠️') && (
        <div className="card"><div style={{fontSize:14,lineHeight:1.8,whiteSpace:'pre-wrap'}}>{itinerary}</div></div>
      )}
    </>
  );
}

const MEMORY_EMOJIS = ['📸','🌅','🍽️','🎉','😂','🏖️','⛰️','🚗','🎵','❤️','🤩','🌊'];

function MemoriesScreen({ trip, members, session }) {
  const [memories, setMemories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [text, setText] = useState('');
  const [emoji, setEmoji] = useState('📸');
  const [adding, setAdding] = useState(false);
  const uid = session?.user?.id;

  useEffect(() => { loadMemories(); }, [trip.id]);

  async function loadMemories() {
    setLoading(true);
    const { data } = await sb.from('trip_memories').select('*, profiles(name)').eq('trip_id', trip.id).order('created_at', { ascending: false });
    if (data) setMemories(data);
    setLoading(false);
  }

  async function addMemory() {
    if (!text.trim()) return;
    setAdding(true);
    const { data } = await sb.from('trip_memories').insert({
      trip_id: trip.id, user_id: uid, content: text.trim(), emoji
    }).select('*, profiles(name)');
    if (data) setMemories(prev => [data[0], ...prev]);
    setText(''); setEmoji('📸');
    setAdding(false);
  }

  async function deleteMemory(id) {
    await sb.from('trip_memories').delete().eq('id', id).eq('user_id', uid);
    setMemories(prev => prev.filter(m => m.id !== id));
  }

  function timeAgo(ts) {
    const diff = Date.now() - new Date(ts).getTime();
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
    return Math.floor(diff/86400000) + 'd ago';
  }

  if (loading) return <div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Loading memories…</div>;

  return (
    <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div className="sec-title">📸 Trip Memories</div>
        <span className="chip">{memories.length} moments</span>
      </div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:16}}>Capture moments, laughs, and highlights from your trip — shared with the whole group.</div>

      {/* Add memory input */}
      <div className="card" style={{marginBottom:16}}>
        <div style={{marginBottom:10,fontWeight:700,fontSize:14}}>✍️ Add a moment</div>
        <div style={{marginBottom:8}}>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:6}}>Pick an emoji:</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {MEMORY_EMOJIS.map(e => (
              <button key={e} onClick={() => setEmoji(e)}
                style={{fontSize:20,background:emoji===e?'#FFF8F0':'transparent',border:emoji===e?'2px solid var(--orange)':'2px solid transparent',borderRadius:8,padding:'2px 6px',cursor:'pointer'}}>
                {e}
              </button>
            ))}
          </div>
        </div>
        <textarea className="form-input" style={{width:'100%',minHeight:80,resize:'vertical',fontSize:14,lineHeight:1.6}}
          placeholder="What happened? Share a memory, funny moment, or highlight…"
          value={text} onChange={e => setText(e.target.value)} />
        <button className="btn btn-primary" style={{marginTop:10,width:'100%'}} onClick={addMemory} disabled={adding||!text.trim()}>
          {adding ? '⏳ Saving…' : `${emoji} Add Memory`}
        </button>
      </div>

      {memories.length === 0 && (
        <div className="empty-state" style={{padding:'24px 0'}}>
          <div className="empty-icon">📸</div>
          <div className="empty-title">No memories yet</div>
          <div className="empty-sub">Be the first to capture a moment from this trip!</div>
        </div>
      )}

      {memories.map(m => (
        <div key={m.id} className="memory-card">
          <div className="memory-emoji">{m.emoji}</div>
          <div className="memory-content">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div className="memory-author">{m.profiles?.name || 'Member'}</div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <div className="memory-time">{timeAgo(m.created_at)}</div>
                {m.user_id === uid && (
                  <button onClick={() => deleteMemory(m.id)}
                    style={{fontSize:11,color:'var(--muted)',background:'none',border:'none',cursor:'pointer',padding:0}}>✕</button>
                )}
              </div>
            </div>
            <div className="memory-text">{m.content}</div>
          </div>
        </div>
      ))}
    </>
  );
}

/* ══════════════════════════════════════════
   GROUP CHAT SCREEN — Supabase Realtime
══════════════════════════════════════════ */
function GroupChatScreen({ trip, members, session }) {
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState('');
  const [sending, setSending] = useState(false);
  const [loading, setLoading] = useState(true);
  const bottomRef = React.useRef(null);
  const pollRef = React.useRef(null);
  const uid = session?.user?.id;
  const myName = members.find(m => m.user_id === uid)?.profiles?.name || 'You';

  useEffect(() => {
    loadMessages(true);
    // Poll every 2.5s — Supabase Realtime WebSocket pattern
    pollRef.current = setInterval(() => loadMessages(false), 2500);
    return () => clearInterval(pollRef.current);
  }, [trip.id]);

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  async function loadMessages(initial) {
    if (initial) setLoading(true);
    const { data } = await sb.from('trip_messages')
      .select('*, profiles(name)')
      .eq('trip_id', trip.id)
      .order('created_at', { ascending: true })
      .limit(100);
    if (data) setMessages(data);
    if (initial) setLoading(false);
  }

  async function sendMessage() {
    if (!text.trim() || sending) return;
    const msg = text.trim();
    setText('');
    setSending(true);

    // Optimistic update — show the message immediately, don't wait for Supabase
    const optimistic = {
      id: 'opt-' + Date.now(),
      trip_id: trip.id,
      user_id: uid,
      message: msg,
      created_at: new Date().toISOString(),
      profiles: { name: myName }
    };
    setMessages(prev => [...prev, optimistic]);

    const { error } = await sb.from('trip_messages').insert({
      trip_id: trip.id,
      user_id: uid,
      message: msg
    });

    if (error) {
      console.warn('Chat insert error:', error.message);
      // Keep the optimistic message visible even if DB insert fails during demo
    } else {
      // Replace optimistic message with real one from DB
      await loadMessages(false);
    }
    setSending(false);
  }

  function fmtTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
  }

  // Group messages by date
  function groupByDate(msgs) {
    const groups = [];
    let lastDate = null;
    msgs.forEach(m => {
      const d = fmtDate(m.created_at);
      if (d !== lastDate) { groups.push({ type:'date', label:d }); lastDate = d; }
      groups.push({ type:'msg', ...m });
    });
    return groups;
  }

  const grouped = groupByDate(messages);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 140px)',margin:'-12px'}}>
      {/* Header */}
      <div style={{background:'linear-gradient(135deg,#0369A1,#0EA5E9)',padding:'12px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <div style={{width:38,height:38,borderRadius:'50%',background:'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>💬</div>
        <div>
          <div style={{fontWeight:800,fontSize:14,color:'#fff'}}>{trip.destination} Group</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,.65)'}}>{members.length} members · live chat</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:5}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:'#22C55E'}}/>
          <span style={{fontSize:11,color:'rgba(255,255,255,.75)'}}>Live</span>
        </div>
      </div>

      {/* Messages area */}
      <div style={{flex:1,overflowY:'auto',padding:'12px 14px',background:'#F0F2F5'}}>
        {!loading && messages.length === 0 && (
          <div style={{textAlign:'center',padding:40}}>
            <div style={{fontSize:40,marginBottom:8}}>👋</div>
            <div style={{fontWeight:700,color:'#0C4A6E',fontSize:15}}>Start the conversation!</div>
            <div style={{fontSize:13,color:'#888',marginTop:4}}>Say hi to your travel group</div>
          </div>
        )}
        {loading && messages.length === 0 && (
          <div style={{textAlign:'center',padding:40,color:'#888',fontSize:13}}>Loading messages…</div>
        )}
        {grouped.map((item, i) => {
          if (item.type === 'date') {
            return (
              <div key={i} style={{textAlign:'center',margin:'10px 0'}}>
                <span style={{background:'rgba(255,255,255,.85)',padding:'3px 12px',borderRadius:12,fontSize:11,color:'#666',fontWeight:600}}>{item.label}</span>
              </div>
            );
          }
          const isMe = item.user_id === uid;
          const senderName = item.profiles?.name || 'Member';
          const initials = senderName.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
          return (
            <div key={item.id} style={{display:'flex',justifyContent:isMe?'flex-end':'flex-start',marginBottom:6,gap:8,alignItems:'flex-end'}}>
              {!isMe && (
                <div style={{width:30,height:30,borderRadius:'50%',background:'var(--teal)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,flexShrink:0,marginBottom:2}}>
                  {initials}
                </div>
              )}
              <div style={{maxWidth:'72%'}}>
                {!isMe && (
                  <div style={{fontSize:11,color:'#666',fontWeight:700,marginBottom:2,marginLeft:4}}>{senderName}</div>
                )}
                <div style={{
                  background: isMe ? '#0369A1' : '#fff',
                  color: isMe ? '#fff' : '#1a1a1a',
                  padding:'9px 13px',
                  borderRadius: isMe ? '16px 4px 16px 16px' : '4px 16px 16px 16px',
                  fontSize:14,
                  lineHeight:1.5,
                  boxShadow:'0 1px 3px rgba(0,0,0,.08)'
                }}>
                  {item.message}
                </div>
                <div style={{fontSize:10,color:'#999',marginTop:2,textAlign:isMe?'right':'left',paddingRight:isMe?2:0,paddingLeft:isMe?0:4}}>
                  {fmtTime(item.created_at)}
                  {isMe && <span style={{marginLeft:4}}>✓✓</span>}
                </div>
              </div>
            </div>
          );
        })}
        <div ref={bottomRef}/>
      </div>

      {/* Input bar */}
      <div style={{background:'#fff',borderTop:'1px solid #E5E7EB',padding:'10px 12px',display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
        <input
          style={{flex:1,border:'1.5px solid #E5E7EB',borderRadius:24,padding:'9px 16px',fontSize:14,outline:'none',background:'#F8FAFC',color:'#1F2937'}}
          placeholder="Message the group…"
          value={text}
          onChange={e => setText(e.target.value)}
          onKeyDown={e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
        />
        <button onClick={sendMessage} disabled={!text.trim() || sending}
          style={{width:42,height:42,borderRadius:'50%',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0,
            background: text.trim() ? '#0369A1' : '#E5E7EB',
            color: text.trim() ? '#fff' : '#999',
            transition:'background .2s'}}>
          ➤
        </button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   AI DISRUPTION AGENT (Agent #5)
══════════════════════════════════════════ */
function AgentScreen({ trip, members, expenses }) {
  const [alerts, setAlerts] = useState([]);
  const [scanning, setScanning] = useState(false);
  const [lastScan, setLastScan] = useState(null);
  const [chatInput, setChatInput] = useState('');
  const [chatHistory, setChatHistory] = useState([]);
  const [chatLoading, setChatLoading] = useState(false);

  const daysUntilTrip = trip.start_date
    ? Math.ceil((new Date(trip.start_date) - new Date()) / 86400000)
    : null;
  const totalSpend = expenses.reduce((s,e) => s+Number(e.amount), 0);

  async function runAgent() {
    setScanning(true); setAlerts([]);

    // Gather trip intelligence
    const tripInfo = {
      destination: trip.destination,
      status: trip.status || 'planning',
      members: members.length,
      daysUntil: daysUntilTrip,
      totalSpend,
      startDate: trip.start_date,
      endDate: trip.end_date,
    };

    const prompt = `You are SafarNama Disruption Agent — an AI agent that proactively monitors a group trip and detects issues, risks, and opportunities.

Trip details:
- Destination: ${tripInfo.destination}
- Status: ${tripInfo.status}
- Members: ${tripInfo.members} people
- Days until trip: ${tripInfo.daysUntil !== null ? tripInfo.daysUntil + ' days' : 'not set'}
- Total spend logged: ₹${tripInfo.totalSpend.toLocaleString('en-IN')}
- Dates: ${tripInfo.startDate || 'not set'} to ${tripInfo.endDate || 'not set'}

Analyze this trip and generate EXACTLY 5 alerts in this JSON format (no markdown, just pure JSON array):
[
  {"type":"warning|info|success|critical","icon":"emoji","title":"short title","message":"2-sentence actionable message"},
  ...
]

Alert types to consider:
- Budget alerts (over/under spending)
- Booking urgency (days left to book flights/hotels)  
- Weather risks for the destination and season
- Group coordination gaps (members, voting)
- Travel document reminders
- Local tips and opportunities

Be specific to ${tripInfo.destination}. Make alerts genuinely useful.`;

    try {
      const reply = await callGemini(prompt);
      // Try to parse JSON from response
      const jsonMatch = reply.match(/\[[\s\S]*\]/);
      if (jsonMatch) {
        const parsed = JSON.parse(jsonMatch[0]);
        setAlerts(parsed);
      } else {
        // Fallback: generate structured alerts manually
        setAlerts(generateFallbackAlerts(tripInfo));
      }
    } catch(e) {
      setAlerts(generateFallbackAlerts(tripInfo));
    }
    setLastScan(new Date());
    setScanning(false);
  }

  function generateFallbackAlerts(info) {
    const alerts = [];
    if (info.daysUntil !== null && info.daysUntil < 30 && info.daysUntil > 0) {
      alerts.push({type:'critical',icon:'⚡',title:'Book Now — Time Running Out',message:`Only ${info.daysUntil} days until your trip to ${info.destination}. Flight and hotel prices surge in the last 2 weeks. Book immediately to avoid 40-60% price increases.`});
    }
    if (info.daysUntil !== null && info.daysUntil > 0) {
      alerts.push({type:'warning',icon:'🌧️',title:'Check Weather Window',message:`Verify the weather forecast for ${info.destination} before finalising activities. Monsoon-sensitive destinations need backup indoor plans.`});
    }
    if (info.totalSpend === 0) {
      alerts.push({type:'info',icon:'💸',title:'No Expenses Logged Yet',message:`Start logging trip expenses now so the budget split stays accurate. Add flight tickets, hotel bookings and group meals as they happen.`});
    }
    if (info.members < 3) {
      alerts.push({type:'info',icon:'👥',title:'Small Group — Invite More',message:`Your group has only ${info.members} member(s). More members mean lower per-person costs. Share the invite code to grow the group.`});
    }
    if (info.status !== 'confirmed') {
      alerts.push({type:'warning',icon:'🗳️',title:'Trip Not Confirmed Yet',message:`The trip status is still "${info.status}". Once the group finishes voting, the coordinator should confirm the trip to lock in the final plan.`});
    }
    alerts.push({type:'success',icon:'✅',title:'Group Travel Detected',message:`SafarNama is actively monitoring your trip to ${info.destination}. All group preferences, votes and budgets are being tracked in real time.`});
    return alerts.slice(0, 5);
  }

  async function sendAgentChat() {
    if (!chatInput.trim()) return;
    const userMsg = chatInput.trim();
    setChatInput('');
    setChatHistory(prev => [...prev, {role:'user', text:userMsg}]);
    setChatLoading(true);

    const context = `You are SafarNama Disruption Agent for a trip to ${trip.destination} with ${members.length} members, ${daysUntilTrip !== null ? daysUntilTrip+' days away' : 'dates TBD'}, total spend ₹${totalSpend.toLocaleString('en-IN')}. Answer concisely in 2-3 sentences.`;
    try {
      const reply = await callGemini(context + '\n\nUser: ' + userMsg);
      setChatHistory(prev => [...prev, {role:'agent', text:reply}]);
    } catch(e) {
      setChatHistory(prev => [...prev, {role:'agent', text:'⚠️ Agent unavailable. Check Groq API key in Profile.'}]);
    }
    setChatLoading(false);
  }

  const alertColors = {
    critical: {bg:'#FEF2F2',border:'#FCA5A5',title:'#991B1B',text:'#7F1D1D'},
    warning:  {bg:'#FFFBEB',border:'#FB923C',title:'#92400E',text:'#78350F'},
    info:     {bg:'#EFF6FF',border:'#93C5FD',title:'#1E40AF',text:'#1E3A8A'},
    success:  {bg:'#F0FDF4',border:'#86EFAC',title:'#166534',text:'#14532D'},
  };

  return (
    <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div>
          <div className="sec-title">🛡️ AI Disruption Agent</div>
          <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>Proactively monitors your trip for risks & opportunities</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={runAgent} disabled={scanning}>
          {scanning ? '⏳ Scanning…' : '🔍 Run Scan'}
        </button>
      </div>

      {lastScan && <div style={{fontSize:11,color:'var(--muted)',marginBottom:12}}>Last scan: {lastScan.toLocaleTimeString()}</div>}

      {/* Agent Status Card */}
      <div style={{background:'linear-gradient(135deg,#0369A1,#0EA5E9)',borderRadius:16,padding:16,marginBottom:16,color:'#fff'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
          <div style={{width:40,height:40,borderRadius:'50%',background:'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>🛡️</div>
          <div>
            <div style={{fontWeight:800,fontSize:15}}>SafarNama Agent</div>
            <div style={{fontSize:11,color:'rgba(255,255,255,.65)'}}>Monitoring • {trip.destination}</div>
          </div>
          <div style={{marginLeft:'auto',background:'#22C55E',borderRadius:20,padding:'3px 10px',fontSize:11,fontWeight:700}}>● Active</div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
          <div style={{background:'rgba(255,255,255,.1)',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800}}>{members.length}</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,.65)'}}>Members</div>
          </div>
          <div style={{background:'rgba(255,255,255,.1)',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800}}>{daysUntilTrip !== null ? (daysUntilTrip > 0 ? daysUntilTrip : 'Now!') : '—'}</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,.65)'}}>Days to Go</div>
          </div>
          <div style={{background:'rgba(255,255,255,.1)',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800}}>{alerts.length}</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,.65)'}}>Alerts</div>
          </div>
        </div>
      </div>

      {scanning && (
        <div style={{textAlign:'center',padding:32}}>
          <div style={{fontSize:36,marginBottom:8}}>🔍</div>
          <div style={{fontWeight:700,color:'var(--navy)'}}>Agent is scanning your trip…</div>
          <div style={{fontSize:13,color:'var(--muted)',marginTop:4}}>Checking budget, bookings, weather risks & group coordination</div>
        </div>
      )}

      {!scanning && alerts.length === 0 && (
        <div className="empty-state" style={{padding:'24px 0'}}>
          <div className="empty-icon">🛡️</div>
          <div className="empty-title">No alerts yet</div>
          <div className="empty-sub">Tap "Run Scan" to let the agent analyse your trip for risks and opportunities.</div>
        </div>
      )}

      {alerts.map((alert, i) => {
        const c = alertColors[alert.type] || alertColors.info;
        return (
          <div key={i} style={{background:c.bg,border:`1.5px solid ${c.border}`,borderRadius:14,padding:14,marginBottom:10}}>
            <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
              <span style={{fontSize:24,flexShrink:0}}>{alert.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:14,color:c.title,marginBottom:4}}>{alert.title}</div>
                <div style={{fontSize:13,color:c.text,lineHeight:1.5}}>{alert.message}</div>
              </div>
            </div>
          </div>
        );
      })}

      {/* Agent Chat */}
      <div className="card" style={{marginTop:16}}>
        <div style={{fontWeight:800,fontSize:14,marginBottom:8}}>💬 Ask the Agent</div>
        <div style={{maxHeight:200,overflowY:'auto',marginBottom:10}}>
          {chatHistory.length === 0 && (
            <div style={{fontSize:13,color:'var(--muted)'}}>Ask the agent anything about your trip risks, budget, or what to prepare…</div>
          )}
          {chatHistory.map((m, i) => (
            <div key={i} style={{marginBottom:8,textAlign:m.role==='user'?'right':'left'}}>
              <div style={{display:'inline-block',maxWidth:'85%',padding:'8px 12px',borderRadius:12,fontSize:13,lineHeight:1.5,
                background:m.role==='user'?'var(--navy)':'#F1F5F9',color:m.role==='user'?'#fff':'var(--text)'}}>
                {m.text}
              </div>
            </div>
          ))}
          {chatLoading && <div style={{fontSize:13,color:'var(--muted)'}}>🛡️ Agent is thinking…</div>}
        </div>
        <div style={{display:'flex',gap:8}}>
          <input className="form-input" style={{flex:1,fontSize:13}} placeholder="e.g. Should we buy travel insurance?"
            value={chatInput} onChange={e => setChatInput(e.target.value)}
            onKeyDown={e => { if(e.key==='Enter') sendAgentChat(); }} />
          <button className="btn btn-primary btn-sm" onClick={sendAgentChat} disabled={chatLoading}>Send</button>
        </div>
      </div>
    </>
  );
}

function InviteModal({ trip, onClose }) {

  const waText = encodeURIComponent(`🌍 Join my SafarNama trip to ${trip.destination}!\nClick to join: ${link}\nInvite code: ${trip.invite_code}`);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet" onClick={e => e.stopPropagation()}>

}

const ADMIN_EMAIL = 'ankallaashoka101@gmail.com';
function AdminScreen({ session, setScr }) {
  const [stats, setStats] = useState({users:0,trips:0,members:0,spend:0});

  useEffect(() => { loadAdmin(); }, []);
  async function loadAdmin() {
    setLoading(true);
    const [{data:expData},{data:profileData},{data:tripData},{data:expTable},{data:memberData}] = await Promise.all([
      sb.from('expenses').select('amount,trip_id'),
      sb.from('profiles').select('*').order('created_at',{ascending:false}),
      sb.from('trips').select('*,profiles(name)').order('created_at',{ascending:false}),
      sb.from('expenses').select('*,profiles(name,avatar_color),trips(destination)').order('created_at',{ascending:false}).limit(30),
      sb.from('trip_members').select('trip_id,user_id,role'),
    ]);
    const totalSpend = (expData||[]).reduce((s,e) => s+Number(e.amount),0);
    setStats({users:(profileData||[]).length,trips:(tripData||[]).length,members:(memberData||[]).length,spend:totalSpend});
    const tcByUser={};
    (memberData||[]).forEach(m => { tcByUser[m.user_id]=(tcByUser[m.user_id]||0)+1; });
    setUsers((profileData||[]).map(p => ({...p,tripCount:tcByUser[p.id]||0})));
    const mcByTrip={},spByTrip={};
    (memberData||[]).forEach(m => { mcByTrip[m.trip_id]=(mcByTrip[m.trip_id]||0)+1; });
    (expData||[]).forEach(e => { spByTrip[e.trip_id]=(spByTrip[e.trip_id]||0)+Number(e.amount); });
    setAllTrips((tripData||[]).map(t => ({...t,memberCount:mcByTrip[t.id]||0,spend:spByTrip[t.id]||0})));
    setExps(expTable||[]);
    setLoading(false);

  if (session?.user?.email !== ADMIN_EMAIL) return (
    <div><div className="back-nav"><button className="back-btn" onClick={() => setScr('dashboard')}>←</button><div className="back-title">Admin</div><div style={{width:30}}/></div>
    <div className="mobile-wrap" style={{textAlign:'center',paddingTop:40}}><div style={{fontSize:48}}>🔒</div><div style={{fontSize:18,fontWeight:800,marginTop:12}}>Access Denied</div></div></div>
  );
  return (
    <div>
      <div className="back-nav">
        <button className="back-btn" onClick={() => setScr('dashboard')}>←</button>
        <div className="back-title">🛡️ Admin Panel</div>
        <button style={{background:'none',border:'none',color:'rgba(255,255,255,.7)',fontSize:18,cursor:'pointer'}} onClick={loadAdmin}>⟳</button>
      </div>
      <div className="mobile-wrap screen-inner" style={{paddingBottom:20}}>
        {loading ? <div style={{textAlign:'center',paddingTop:40,color:'var(--muted)'}}>Loading…</div> : (
          <>
            <div className="admin-stat-grid">
              <div className="admin-stat"><div className="admin-stat-val">{stats.users}</div><div className="admin-stat-label">👥 Users</div></div>
              <div className="admin-stat"><div className="admin-stat-val">{stats.trips}</div><div className="admin-stat-label">✈️ Trips</div></div>
              <div className="admin-stat"><div className="admin-stat-val">{stats.members}</div><div className="admin-stat-label">🤝 Memberships</div></div>
              <div className="admin-stat" style={{background:'linear-gradient(135deg,#d97706,#f59e0b)'}}><div className="admin-stat-val">₹{stats.spend>=1000?(stats.spend/1000).toFixed(1)+'K':stats.spend}</div><div className="admin-stat-label">💸 Total Spend</div></div>
            </div>
            <div className="admin-section">👥 Users ({users.length})</div>
            <div className="card" style={{padding:'0 4px'}}>
              <div className="admin-table-wrap"><table className="admin-table"><thead><tr><th>Name</th><th>Phone</th><th>Trips</th><th>Joined</th></tr></thead><tbody>
                {users.length===0 && <tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:16}}>No users yet</td></tr>}
                {users.map((u,i) => <tr key={u.id}><td><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:26,height:26,borderRadius:'50%',background:u.avatar_color||COLORS[i%COLORS.length],display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff',flexShrink:0}}>{initials(u.name)}</div><span style={{fontWeight:600,fontSize:13}}>{u.name}</span></div></td><td style={{color:'var(--muted)'}}>{u.phone||'—'}</td><td><span style={{background:'#EFF6FF',color:'var(--navy)',padding:'2px 8px',borderRadius:8,fontSize:11,fontWeight:700}}>{u.tripCount}</span></td><td style={{color:'var(--muted)',fontSize:11}}>{new Date(u.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</td></tr>)}
              </tbody></table></div>
            </div>
            <div className="admin-section">✈️ Trips ({allTrips.length})</div>
            <div className="card" style={{padding:'0 4px'}}>
              <div className="admin-table-wrap"><table className="admin-table"><thead><tr><th>Destination</th><th>Code</th><th>👥</th><th>Spend</th></tr></thead><tbody>
                {allTrips.length===0 && <tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:16}}>No trips yet</td></tr>}
                {allTrips.map(t => <tr key={t.id}><td><span style={{fontWeight:700}}>📍 {t.destination}</span><div style={{fontSize:10,color:'var(--muted)'}}>{t.name}</div></td><td><code style={{background:'#F0F2F8',padding:'2px 6px',borderRadius:4,fontSize:11,fontWeight:700,letterSpacing:1}}>{t.invite_code}</code></td><td style={{fontWeight:700,color:'var(--navy)'}}>{t.memberCount}</td><td style={{color:'var(--green)',fontWeight:700,fontSize:12}}>{fmtCurrency(t.spend)}</td></tr>)}
              </tbody></table></div>
            </div>
            <div className="admin-section">💸 Recent Expenses</div>
            <div className="card" style={{padding:'0 4px'}}>
              <div className="admin-table-wrap"><table className="admin-table"><thead><tr><th>Item</th><th>Trip</th><th>By</th><th>₹</th></tr></thead><tbody>
                {exps.length===0 && <tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:16}}>No expenses yet</td></tr>}
                {exps.map((e,i) => <tr key={e.id||i}><td style={{fontWeight:600}}>{e.title}</td><td style={{color:'var(--muted)',fontSize:11}}>{e.trips?.destination||'—'}</td><td style={{fontSize:11}}>{e.profiles?.name||'—'}</td><td style={{color:'var(--orange)',fontWeight:800}}>{fmtCurrency(e.amount)}</td></tr>)}
              </tbody></table></div>
            </div>
            <div style={{textAlign:'center',marginTop:12,fontSize:12,color:'var(--muted)'}}>For full charts open safarnama_analytics.html</div>
          </>
        )}
      </div>
    </div>
  );
}

/* ── Mount ── */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
