<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SafarNama – AI Group Travel</title>
<meta name="theme-color" content="#1B2B6B"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1B2B6B"/>
<meta name="apple-mobile-web-app-title" content="SafarNama"/>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;SafarNama&quot;,&quot;short_name&quot;:&quot;SafarNama&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%231B2B6B&quot;,&quot;theme_color&quot;:&quot;%231B2B6B&quot;,&quot;description&quot;:&quot;AI-powered group travel planner&quot;}"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--navy:#1B2B6B;--orange:#F7941D;--teal:#0D9488;--green:#22C55E;--red:#EF4444;--purple:#8B5CF6;--bg:#F1F5F9;--card:#fff;--text:#0F172A;--muted:#64748B;--border:#E2E8F0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
button{cursor:pointer;border:none;outline:none;font-family:inherit;}
input,textarea,select{font-family:inherit;outline:none;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── TOP NAVBAR (dashboard) ── */
.top-navbar{display:flex;align-items:center;padding:0 28px;height:64px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.nav-brand{font-size:20px;font-weight:900;color:var(--navy);margin-right:16px;white-space:nowrap;flex-shrink:0;}
.nav-brand em{color:var(--orange);font-style:normal;}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;}
.nav-link{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);background:none;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;}
.nav-link:hover,.nav-link.active{color:var(--text);background:#F1F5F9;}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0;}
.nav-notif{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;position:relative;}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,#0F2048 0%,#1B4F8C 45%,#0D7874 100%);padding:52px 28px 40px;position:relative;overflow:hidden;}
.hero::before{content:'✈️';position:absolute;right:5%;top:20%;font-size:80px;opacity:.08;transform:rotate(-15deg);}
.hero::after{content:'🌍';position:absolute;left:3%;bottom:10%;font-size:120px;opacity:.06;}
.hero-inner{max-width:1120px;margin:0 auto;position:relative;z-index:1;}
.hero-title{font-size:32px;font-weight:900;color:#fff;margin-bottom:6px;line-height:1.2;}
.hero-sub{color:rgba(255,255,255,.65);font-size:15px;margin-bottom:28px;}

/* ── AI CREATOR CARD ── */
.ai-creator{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.ai-creator-label{font-size:15px;font-weight:800;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.ai-creator-fields{display:flex;gap:10px;flex-wrap:wrap;}
.ai-creator-inp-wrap{flex:1;min-width:140px;position:relative;}
.ai-creator-inp-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;}
.ai-creator-inp{width:100%;padding:11px 12px 11px 34px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--text);transition:border .2s;}
.ai-creator-inp:focus{border-color:var(--teal);}
.ai-creator-btn{padding:11px 20px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s;flex-shrink:0;}
.ai-creator-btn:hover{background:#0b7a72;}

/* ── MAIN CONTENT ── */
.page-body{max-width:1120px;margin:0 auto;padding:32px 28px 60px;}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.section-title{font-size:20px;font-weight:800;color:var(--text);}
.section-link{color:var(--orange);font-size:13px;font-weight:700;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;}

/* ── QUICK ACTIONS ── */
.quick-actions{display:flex;gap:12px;margin-bottom:32px;}
.qa-btn{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:700;transition:all .2s;text-align:center;}
.qa-btn.primary{background:var(--orange);color:#fff;box-shadow:0 4px 12px rgba(247,148,29,.3);}
.qa-btn.primary:hover{background:#e07f0a;transform:translateY(-1px);}
.qa-btn.outline{background:#fff;color:var(--orange);border:2px solid var(--orange);}
.qa-btn.outline:hover{background:#FFF3E0;}

/* ── TRIP CARDS GRID ── */
.trips-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:960px){.trips-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.trips-grid{grid-template-columns:1fr;}}

.trip-photo-card{border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.1);transition:transform .2s,box-shadow .2s;position:relative;height:230px;animation:fadeIn .3s ease;}
.trip-photo-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.18);}
.tpc-photo{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .4s;}
.trip-photo-card:hover .tpc-photo{transform:scale(1.05);}
.tpc-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,rgba(0,0,0,.72) 100%);}
.tpc-body{position:absolute;bottom:0;left:0;right:0;padding:16px;}
.tpc-dest{font-size:20px;font-weight:800;color:#fff;line-height:1.2;}
.tpc-name{font-size:12px;color:rgba(255,255,255,.75);margin-top:3px;}
.tpc-meta{display:flex;align-items:center;gap:8px;margin-top:8px;}
.tpc-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-planning{background:rgba(59,130,246,.85);color:#fff;}
.badge-voting{background:rgba(247,148,29,.9);color:#fff;}
.badge-confirmed{background:rgba(34,197,94,.9);color:#fff;}
.tpc-code{background:rgba(255,255,255,.18);color:#fff;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;backdrop-filter:blur(4px);}
.tpc-role{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.45);color:#fff;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;backdrop-filter:blur(4px);}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 16px;color:var(--muted);}
.empty-icon{font-size:56px;margin-bottom:14px;}
.empty-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px;}
.empty-sub{font-size:14px;max-width:320px;margin:0 auto 20px;}

/* ── OLD MOBILE STYLES (for inner trip screens) ── */
.mobile-wrap{max-width:680px;margin:0 auto;padding:16px 16px 80px;}
.screen-inner{animation:fadeUp .3s ease;}
.back-nav{display:flex;align-items:center;padding:14px 20px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:100;gap:12px;}
.back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;}
.back-title{font-size:16px;font-weight:700;flex:1;}
.back-action{background:none;border:none;color:rgba(255,255,255,.8);font-size:20px;cursor:pointer;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.bottom-nav::-webkit-scrollbar{display:none;}
.bn-item{flex:0 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;gap:3px;font-size:10px;color:var(--muted);border:none;background:none;cursor:pointer;}
.bn-item.active{color:var(--orange);}
@media(min-width:400px){.bn-item{min-width:64px;}}
@media(min-width:500px){.bn-item{flex:1;min-width:0;}}
.bn-icon{font-size:22px;line-height:1;}

/* ── CARD / FORMS (inner screens) ── */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--text);}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-title{font-size:17px;font-weight:800;color:var(--text);}
.sec-link{font-size:13px;color:var(--orange);font-weight:600;}
.chip{background:#F0F2F8;color:var(--navy);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.chip.orange{background:#FFF3E0;color:var(--orange);}
.chip.green{background:#DCFCE7;color:#16A34A;}
.form-group{margin-bottom:14px;}
.form-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;transition:border .2s;background:#fff;}
.form-input:focus{border-color:var(--orange);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.err-msg{background:#FEE2E2;color:var(--red);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;}

/* ── BUTTONS (inner) ── */
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;text-align:center;transition:all .2s;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{background:#e07f0a;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-outline{background:transparent;border:2px solid var(--orange);color:var(--orange);}
.btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;width:auto;display:inline-block;}
.btn-wa{background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}

/* ── AUTH ── */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy) 0%,#2a3f8f 50%,var(--orange) 150%);}
.auth-card{background:#fff;border-radius:24px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.auth-tabs{display:flex;background:#F0F2F8;border-radius:10px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:600;border:none;background:none;color:var(--muted);transition:all .2s;}
.auth-tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.auth-title{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}

/* ── LOADING ── */
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),#2a3f8f);}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
.loading-text{color:rgba(255,255,255,.8);font-size:14px;}

/* ── TRIP DETAIL INNER ── */
.map-box{background:linear-gradient(135deg,#e8f4fd,#d4eaf7);border-radius:16px;height:220px;position:relative;overflow:hidden;margin-bottom:12px;}
.map-bg{position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='400' height='220' xmlns='http://www.w3.org/2000/svg'%3E%3Crect fill='%23d4eaf7' width='400' height='220'/%3E%3Cellipse cx='200' cy='130' rx='160' ry='80' fill='%23c5e0f0'/%3E%3Cellipse cx='80' cy='160' rx='60' ry='30' fill='%23b8d4e8'/%3E%3Cellipse cx='320' cy='90' rx='70' ry='35' fill='%23c0d8ea'/%3E%3Cpath d='M0 160 Q100 140 200 150 Q300 160 400 145 L400 220 L0 220Z' fill='%23a8c8d8' opacity='.5'/%3E%3C/svg%3E") center/cover;}
.dest-pin{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);text-align:center;}
.dest-pin .pin-dot{width:16px;height:16px;background:var(--red);border-radius:50%;margin:0 auto 2px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.dest-pin .pin-label{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;}
.friend-pin{position:absolute;text-align:center;}
.friend-pin .fp-avatar{width:32px;height:32px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);margin:0 auto 2px;}
.friend-pin .fp-name{font-size:9px;font-weight:700;color:var(--navy);background:rgba(255,255,255,.9);padding:1px 4px;border-radius:3px;}
.prog-bar{height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden;margin-top:8px;}
.prog-fill{height:100%;border-radius:3px;transition:width .8s ease;background:linear-gradient(90deg,var(--orange),#FFD700);}
.member-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.member-row:last-child{border-bottom:none;}
.m-info{flex:1;}
.m-name{font-size:14px;font-weight:700;}
.m-city{font-size:12px;color:var(--muted);}
.m-role{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.m-role.coordinator{background:#FFF3E0;color:var(--orange);}
.m-role.member{background:#F0F9FF;color:var(--navy);}
.place-card{border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.place-img{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;}
.place-body{background:#fff;padding:12px;}
.place-name{font-size:15px;font-weight:700;margin-bottom:4px;}
.vote-bar{display:flex;align-items:center;gap:8px;margin-top:8px;}
.vote-btn{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:700;}
.vote-up{background:#DCFCE7;color:#16A34A;}
.vote-dn{background:#FEE2E2;color:var(--red);}
.vote-count{font-size:12px;color:var(--muted);}
.hotel-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.hotel-name{font-size:15px;font-weight:800;margin-bottom:4px;}
.hotel-stars{color:#F59E0B;font-size:14px;}
.hotel-price{font-size:18px;font-weight:800;color:var(--orange);}
.hotel-per{font-size:12px;color:var(--muted);}
.hotel-tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.hotel-tag{background:#F0F2F8;padding:3px 8px;border-radius:6px;font-size:11px;color:var(--navy);font-weight:600;}
.exp-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.exp-row:last-child{border-bottom:none;}
.exp-title{font-size:14px;font-weight:700;}
.exp-paid{font-size:11px;color:var(--muted);}
.exp-amt{font-size:16px;font-weight:800;color:var(--navy);}
.exp-pp{font-size:11px;color:var(--orange);text-align:right;}
.total-card{background:linear-gradient(135deg,var(--navy),#2a3f8f);border-radius:16px;padding:16px;color:#fff;margin-bottom:12px;text-align:center;}
.total-label{font-size:13px;opacity:.8;margin-bottom:4px;}
.total-amt{font-size:32px;font-weight:900;}
.total-pp{font-size:14px;opacity:.8;margin-top:4px;}
.chat-area{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.chat-bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;}
.chat-ai{background:#fff;color:var(--text);border-radius:4px 16px 16px 16px;align-self:flex-start;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.chat-user{background:var(--navy);color:#fff;border-radius:16px 4px 16px 16px;align-self:flex-end;}
.chat-input-row{display:flex;gap:8px;}
.chat-input{flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;}
.chat-input:focus{border-color:var(--orange);}
.chat-send{background:var(--orange);color:#fff;border-radius:10px;padding:0 16px;font-size:18px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:300;}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:520px;animation:fadeUp .3s ease;}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.invite-code-box{background:#F0F2F8;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.invite-code{font-size:22px;font-weight:900;letter-spacing:3px;color:var(--navy);}
.copy-btn{background:var(--navy);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;}
.invite-link-box{background:#F0F2F8;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);word-break:break-all;margin-bottom:12px;}
.profile-header{background:linear-gradient(135deg,var(--navy),#2a3f8f);border-radius:20px;padding:24px;color:#fff;text-align:center;margin-bottom:16px;}
.profile-avatar-big{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;margin:0 auto 10px;}
.profile-name{font-size:20px;font-weight:800;}
.profile-email{font-size:13px;opacity:.7;}
.admin-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.admin-stat{background:linear-gradient(135deg,var(--navy),#2a3f8f);border-radius:14px;padding:14px;color:#fff;text-align:center;}
.admin-stat-val{font-size:28px;font-weight:900;}
.admin-stat-label{font-size:11px;opacity:.7;margin-top:2px;}
.admin-table-wrap{overflow-x:auto;}
.admin-table{width:100%;border-collapse:collapse;font-size:12px;}
.admin-table th{text-align:left;padding:8px 10px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);}
.admin-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.admin-section{font-size:15px;font-weight:800;margin:16px 0 10px;}
.join-input{text-transform:uppercase;letter-spacing:4px;font-size:20px;font-weight:800;text-align:center;}
/* top-nav (inner screens only — inside back-nav) */
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:100;}
.top-nav h2{font-size:17px;font-weight:700;}
.notif-btn{position:relative;background:none;border:none;font-size:22px;color:#fff;}

/* ── LEAFLET MAP ── */
#tracker-map{height:320px;border-radius:16px;overflow:hidden;margin-bottom:12px;z-index:1;}
.leaflet-container{font-family:inherit;}
.lf-avatar-marker{width:36px;height:36px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;}
.lf-dest-marker{background:var(--red);color:#fff;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.gps-status{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;}
.gps-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.gps-dot.active{background:var(--green);animation:pulse 1.5s infinite;}

const sb = (() => {
  let _sess = null; let _listeners = [];
  try { const s = localStorage.getItem(SESSION_KEY); if (s) _sess = JSON.parse(s); } catch(e) {}
  function _hdrs(prefer) {
    const h = {'Content-Type':'application/json','apikey':SUPA_KEY,'Prefer':prefer||'return=representation'};
    if (_sess?.access_token) h['Authorization'] = 'Bearer ' + _sess.access_token;

  function _save(s) { _sess = s; s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); }
  const auth = {
    async getSession() {
      if (!_sess) return {data:{session:null}};
      if (_sess.expires_at && Date.now()/1000 > _sess.expires_at) { _save(null); return {data:{session:null}}; }
      return {data:{session:_sess}};
    },
    async signUp({email,password,options={}}) {
      const r = await fetch(`${SUPA_URL}/auth/v1/signup`,{method:'POST',headers:_hdrs(),body:JSON.stringify({email,password,data:options.data||{}})});
      const d = await r.json();
      if (!r.ok || d.error) return {data:null,error:{message:d.msg||d.error_description||d.message||'Signup failed'}};
      if (d.access_token) { const sess={access_token:d.access_token,user:d.user,expires_at:d.expires_at}; _save(sess); _listeners.forEach(fn=>fn('SIGNED_IN',sess)); }
      else if (d.id) return {data:{user:d},error:null,needsConfirm:true};
      return {data:{user:d.user||d},error:null};
    },
    async signInWithPassword({email,password}) {
      const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:_hdrs(),body:JSON.stringify({email,password})});
      const d = await r.json();
      if (!r.ok || d.error_code) return {error:{message:d.error_description||d.msg||'Invalid email or password'}};
      const sess = {access_token:d.access_token,user:d.user,expires_at:d.expires_at};
      _save(sess); _listeners.forEach(fn=>fn('SIGNED_IN',sess));
      return {data:{session:sess,user:d.user},error:null};
    },
    async signOut() {
      if (_sess?.access_token) await fetch(`${SUPA_URL}/auth/v1/logout`,{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+_sess.access_token}}).catch(()=>{});
      _save(null); _listeners.forEach(fn=>fn('SIGNED_OUT',null));
    },
    onAuthStateChange(cb) {
      _listeners.push(cb);
      if (_sess) setTimeout(()=>cb('SIGNED_IN',_sess),0);
      return {data:{subscription:{unsubscribe(){ _listeners=_listeners.filter(f=>f!==cb); }}}};
    }
  };
  function from(table) {
    let _sel='*',_filt=[],_ord=null,_lim=null,_cnt=false;
    const q = {
      select(cols,opts={}){ _sel=cols||'*'; if(opts.count==='exact') _cnt=true; return q; },
      eq(col,val){ _filt.push(`${col}=eq.${encodeURIComponent(val)}`); return q; },
      order(col,{ascending=true,foreignTable}={}){ if(!foreignTable) _ord=`${col}.${ascending?'asc':'desc'}`; return q; },
      limit(n){ _lim=n; return q; },
      single(){ return q._run(true); },
      async _run(single=false){
        const p=[`select=${encodeURIComponent(_sel)}`,..._filt];
        if(_ord) p.push(`order=${_ord}`);
        if(_lim) p.push(`limit=${_lim}`);
        const url=`${SUPA_URL}/rest/v1/${table}?${p.join('&')}`;
        const r=await fetch(url,{headers:_hdrs(_cnt?'count=exact':undefined)});
        if(_cnt){ const cr=r.headers.get('Content-Range'); return {count:cr?parseInt(cr.split('/')[1]):0,data:null,error:null}; }
        const data=await r.json();
        if(!r.ok) return {data:null,error:{message:data.message||data.hint||'Query failed'}};
        if(single) return {data:Array.isArray(data)?(data[0]||null):data,error:null};
        return {data,error:null};
      },
      then(res,rej){ return q._run().then(res,rej); },
      insert(body){
        const ins={
          select(){ return ins; },
          single(){
            return fetch(`${SUPA_URL}/rest/v1/${table}`,{method:'POST',headers:_hdrs(),body:JSON.stringify(body)})
              .then(async r=>{ const d=await r.json(); if(!r.ok) return {data:null,error:{message:d.message||d.details||'Insert failed'}}; return {data:Array.isArray(d)?d[0]:d,error:null}; });
          },
          then(res){ return ins.single().then(res); }
        };
        return ins;
      },
      upsert(body,{onConflict}={}){
        const url=`${SUPA_URL}/rest/v1/${table}`+(onConflict?`?on_conflict=${onConflict}`:'');
        return fetch(url,{method:'POST',headers:{..._hdrs(),'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)})
          .then(async r=>{ const d=await r.json(); if(!r.ok) return {data:null,error:{message:d.message||'Upsert failed'}}; return {data:Array.isArray(d)?d[0]:d,error:null}; });
      },
      update(body){
        const upd={
          eq(col,val){ _filt.push(`${col}=eq.${encodeURIComponent(val)}`); return upd; },
          then(res){ const p=_filt.length?'?'+_filt.join('&'):''; return fetch(`${SUPA_URL}/rest/v1/${table}${p}`,{method:'PATCH',headers:_hdrs(),body:JSON.stringify(body)}).then(async r=>{ const d=await r.json(); res(!r.ok?{data:null,error:{message:d.message||'Update failed'}}:{data:d,error:null}); }); }
        };
        return upd;
      }
    };
    return q;
  }
  return { auth, from };
})();

// Generate dynamic pricing based on date (earlier = cheaper, weekend = premium)
function flightPrice(base, date, adults) {
  const d = new Date(date);
  const daysAhead = Math.max(0, (d - Date.now()) / 86400000);
  const isWeekend = d.getDay() === 0 || d.getDay() === 6;
  let multiplier = daysAhead > 30 ? 0.85 : daysAhead > 14 ? 1.0 : daysAhead > 7 ? 1.2 : 1.45;
  if (isWeekend) multiplier *= 1.15;
  return Math.round(base * multiplier * (0.92 + Math.random() * 0.16));
}

async function searchFlights(origin, dest, date, adults) {
  await new Promise(r => setTimeout(r, 900)); // realistic loading delay
  const key = `${origin}-${dest}`;
  const reverse = `${dest}-${origin}`;
  let flights = FLIGHT_DB[key] || FLIGHT_DB[reverse] || null;

  if (!flights) {
    // Generic fallback for any route not in DB
    flights = [
      {airline:'IndiGo',    code:`6E-${Math.floor(Math.random()*9000)+1000}`, dep:'07:30', arr:'10:00', dur:'2h 30m', stops:0, base:3800},
      {airline:'Air India', code:`AI-${Math.floor(Math.random()*900)+100}`,   dep:'10:45', arr:'13:20', dur:'2h 35m', stops:0, base:5100},
      {airline:'SpiceJet',  code:`SG-${Math.floor(Math.random()*900)+100}`,   dep:'15:00', arr:'17:40', dur:'2h 40m', stops:0, base:3200},
      {airline:'IndiGo',    code:`6E-${Math.floor(Math.random()*9000)+1000}`, dep:'19:30', arr:'23:00', dur:'3h 30m', stops:1, base:2700},
    ];
  }

  return flights.map((f, i) => ({
    id: i,
    airline: f.airline,
    flightNo: f.code,
    dep: f.dep,
    arr: f.arr,
    dur: f.dur,
    stops: f.stops,
    depCode: origin,
    arrCode: dest,
    pricePerPerson: flightPrice(f.base, date, adults),
    adults,
  }));
}

async function callGemini(prompt) {
  const key = getGeminiKey();
  if (!key) throw new Error('NO_KEY');
  const r = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{parts:[{text: prompt}]}], generationConfig:{maxOutputTokens:600,temperature:0.7} }) }
  );
  const d = await r.json();
  if (!r.ok) throw new Error(d.error?.message || 'Gemini error');
  return d.candidates?.[0]?.content?.parts?.[0]?.text || 'No response from AI.';
}

/* ══════════════════════════════════════════
   APP (state + logic unchanged from v3)
══════════════════════════════════════════ */
function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [trips, setTrips] = useState([]);
  const [currentTrip, setCurrentTrip] = useState(null);
  const [members, setMembers] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [places, setPlaces] = useState(PLACES);
  const [scr, setScr] = useState('loading');
  const [authMode, setAuthMode] = useState('login');
  const [showInviteModal, setShowInviteModal] = useState(false);
  const [showAddExp, setShowAddExp] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [notifications, setNotifications] = useState([]);

  async function loadNotifications(uid) {
    const { data } = await sb.from('notifications').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(20);
    if (data) setNotifications(data);
  }

  async function markAllRead(uid) {
    await sb.from('notifications').update({ read: true }).eq('user_id', uid);
    setNotifications(prev => prev.map(n => ({ ...n, read: true })));
  }

  async function sendNotifications(tripId, membersList, fromUserId, message) {
    const targets = (membersList || []).filter(m => m.user_id !== fromUserId);
    if (!targets.length) return;
    await Promise.all(targets.map(m =>
      sb.from('notifications').insert({ trip_id: tripId, user_id: m.user_id, message, read: false })
    ));
  }

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const ic = params.get('invite');
    if (ic) sessionStorage.setItem('pendingInvite', ic);
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      if (session) loadProfile(session.user.id);
      else setScr('auth');
    });
    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
      setSession(session);
      if (session) loadProfile(session.user.id);
      else setScr('auth');
    });
    return () => subscription.unsubscribe();
  }, []);

  async function loadProfile(uid) {
    const { data } = await sb.from('profiles').select('*').eq('id', uid).single();
    if (data) {
      setProfile(data);
      await loadTrips(uid);
      loadNotifications(uid);
      const pending = sessionStorage.getItem('pendingInvite');
      if (pending) { sessionStorage.removeItem('pendingInvite'); await joinTripByCode(pending, uid, data); }
      setScr('dashboard');
    }
  }

  async function loadTrips(uid) {
    const { data } = await sb.from('trip_members').select('*, trips(*)').eq('user_id', uid).order('created_at', { foreignTable:'trips', ascending:false });
    if (data) setTrips(data.map(tm => ({ ...tm.trips, myRole:tm.role, myProgress:tm.progress })));
  }

  async function loadTripData(trip) {
    setCurrentTrip(trip);
    const { data: mems } = await sb.from('trip_members').select('*, profiles(*)').eq('trip_id', trip.id);
    if (mems) setMembers(mems);
    const { data: exps } = await sb.from('expenses').select('*, profiles(name,avatar_color)').eq('trip_id', trip.id);
    if (exps) setExpenses(exps);
    setScr('tracker');
  }

  async function joinTripByCode(code, uid, prof) {
    const { data: trip } = await sb.from('trips').select('*').eq('invite_code', code.toUpperCase()).single();
    if (!trip) return;
    await sb.from('trip_members').upsert({ trip_id:trip.id, user_id:uid, role:'member', from_city:'Your City', progress:0 }, { onConflict:'trip_id,user_id' });
    await loadTrips(uid);
  }

  if (scr === 'loading') return <LoadingScreen />;
  if (scr === 'auth') return <AuthScreen authMode={authMode} setAuthMode={setAuthMode} setScr={setScr} setProfile={setProfile} setSession={setSession} />;
  if (scr === 'create-trip') return <CreateTripScreen session={session} profile={profile} setScr={setScr} loadTrips={loadTrips} />;
  if (scr === 'join-trip') return <JoinTripScreen session={session} profile={profile} setScr={setScr} loadTrips={loadTrips} />;
  if (scr === 'profile-scr') return <ProfileScreen profile={profile} session={session} setScr={setScr} setSession={setSession} />;
  if (scr === 'admin-scr') return <AdminScreen session={session} setScr={setScr} />;
  if (scr === 'dashboard') return <DashboardScreen profile={profile} trips={trips} session={session} setScr={setScr} loadTripData={loadTripData} notifications={notifications} markAllRead={uid => markAllRead(uid)} />;

  if (!currentTrip) { setScr('dashboard'); return null; }

  const tripNav = (
    <div className="bottom-nav">
      {[{id:'tracker',icon:'🗺️',label:'Track'},{id:'voting',icon:'🗳️',label:'Vote'},
        {id:'itinerary',icon:'📋',label:'Plan'},{id:'flights',icon:'✈️',label:'Book'},{id:'cost',icon:'💸',label:'Split'},{id:'ai-chat',icon:'🤖',label:'AI'}]
        .map(n => (
        <button key={n.id} className={'bn-item'+(scr===n.id?' active':'')} onClick={() => setScr(n.id)}>
          <span className="bn-icon">{n.icon}</span>{n.label}
        </button>
      ))}
    </div>
  );

  const tripTopNav = (
    <div className="back-nav">
      <button className="back-btn" onClick={() => setScr('dashboard')}>←</button>
      <div className="back-title">📍 {currentTrip.destination}</div>
      <button className="back-action" onClick={() => setShowInviteModal(true)}>➕</button>
    </div>
  );

  return (
    <div>
      {tripTopNav}
      <div className="mobile-wrap screen-inner">
        {scr === 'tracker' && <TrackerScreen trip={currentTrip} members={members} session={session} profile={profile} loadTripData={loadTripData} />}
        {scr === 'places' && <PlacesScreen places={places} setPlaces={setPlaces} trip={currentTrip} members={members} />}
        {scr === 'hotels' && <HotelsScreen trip={currentTrip} members={members} />}
        {scr === 'cost' && <CostScreen trip={currentTrip} members={members} expenses={expenses} setExpenses={setExpenses} session={session} profile={profile} showAddExp={showAddExp} setShowAddExp={setShowAddExp} sendNotifications={sendNotifications} />}
        {scr === 'voting' && <VotingScreen trip={currentTrip} members={members} session={session} sendNotifications={sendNotifications} />}
        {scr === 'itinerary' && <ItineraryScreen trip={currentTrip} members={members} />}
        {scr === 'flights' && <FlightsScreen trip={currentTrip} members={members} />}
        {scr === 'ai-chat' && <AiChatScreen trip={currentTrip} />}
      </div>
      {tripNav}
      {showInviteModal && <InviteModal trip={currentTrip} onClose={() => setShowInviteModal(false)} />}
    </div>
  );
}

/* ══════════════════════════════════════════
   AUTH SCREEN
══════════════════════════════════════════ */
function AuthScreen({ authMode, setAuthMode, setScr, setProfile, setSession }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState('');

  async function submit() {
    setErr(''); setMsg(''); setLoading(true);
    if (authMode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { setErr(error.message); setLoading(false); return; }
    } else {
      if (!name.trim()) { setErr('Name is required'); setLoading(false); return; }
      const { data, error, needsConfirm } = await sb.auth.signUp({ email, password, options:{ data:{ name:name.trim(), phone:phone.trim(), avatar_color: '#F7941D' } } });
      if (error) { setErr(error.message); setLoading(false); return; }
      if (needsConfirm) { setMsg('✅ Account created! Check your email to confirm, then log in.'); setLoading(false); setAuthMode('login'); return; }
    }
    setLoading(false);
  }

  return (
    <div className="auth-screen">
      <div style={{marginBottom:24,textAlign:'center'}}>
        <img src={LOGO_URI} alt="SafarNama" style={{width:90,height:90,borderRadius:'50%',marginBottom:10,boxShadow:'0 4px 20px rgba(0,0,0,.3)'}} />
        <div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginTop:4}}>Plan group trips, together</div>
      </div>
      <div className="auth-card">
        <div className="auth-tabs">
          <button className={'auth-tab'+(authMode==='login'?' active':'')} onClick={() => { setAuthMode('login'); setErr(''); }}>Login</button>
          <button className={'auth-tab'+(authMode==='signup'?' active':'')} onClick={() => { setAuthMode('signup'); setErr(''); }}>Sign Up</button>
        </div>
        {msg && <div style={{background:'#D1FAE5',color:'#065F46',padding:'10px 12px',borderRadius:8,fontSize:13,marginBottom:12}}>{msg}</div>}
        {err && <div className="err-msg">{err}</div>}
        {authMode === 'signup' && <>
          <div className="form-group">
            <label className="form-label">Full Name</label>
            <input className="form-input" placeholder="Ashok Ankalla" value={name} onChange={e => setName(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Phone (optional)</label>
            <input className="form-input" placeholder="+91 9999999999" value={phone} onChange={e => setPhone(e.target.value)} />
          </div>
        </>}
        <div className="form-group">
          <label className="form-label">Email</label>
          <input className="form-input" type="email" placeholder="you@example.com" value={email} onChange={e => setEmail(e.target.value)} />
        </div>
        <div className="form-group">
          <label className="form-label">Password</label>
          <input className="form-input" type="password" placeholder="Min 6 characters" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key==='Enter' && submit()} />
        </div>
        <button className="btn btn-primary" onClick={submit} disabled={loading} style={{opacity:loading?.6:1}}>
          {loading ? '⏳ Please wait…' : authMode==='login' ? '🚀 Log In' : '✨ Create Account'}
        </button>
      </div>
    </div>
  );
}

function CreateTripScreen({ session, profile, setScr, loadTrips }) {
  const [name, setName] = useState('');
  const [dest, setDest] = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [fromCity, setFromCity] = useState('');
  const [transport, setTransport] = useState('flight');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  async function createTrip() {
    if (!name || !dest) { setErr('Trip name and destination are required.'); return; }
    setLoading(true); setErr('');
    const uid = session.user.id;
    const { data: trip, error } = await sb.from('trips').insert({
      name, destination:dest, start_date:startDate||null, end_date:endDate||null, created_by:uid
    }).select().single();
    if (error) { setErr(error.message); setLoading(false); return; }
    await sb.from('trip_members').insert({ trip_id:trip.id, user_id:uid, role:'coordinator', from_city:fromCity||'Your City', transport_mode:transport, progress:0 });
    await loadTrips(uid);
    setLoading(false);
    setScr('dashboard');
  }

  return (
    <div>
      <div className="back-nav">
        <button className="back-btn" onClick={() => setScr('dashboard')}>←</button>
        <div className="back-title">Plan a New Trip ✈️</div>
        <div style={{width:30}}/>
      </div>
      <div className="mobile-wrap screen-inner" style={{paddingBottom:20}}>
        {err && <div className="err-msg">{err}</div>}
        <div className="card">
          <div className="card-title">Trip Details</div>
          <div className="form-group"><label className="form-label">Trip Name</label><input className="form-input" placeholder="Goa Squad Trip 2025" value={name} onChange={e => setName(e.target.value)} /></div>
          <div className="form-group"><label className="form-label">Destination</label><input className="form-input" placeholder="Goa, India" value={dest} onChange={e => setDest(e.target.value)} /></div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Start Date</label><input className="form-input" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} /></div>
            <div className="form-group"><label className="form-label">End Date</label><input className="form-input" type="date" value={endDate} onChange={e => setEndDate(e.target.value)} /></div>
          </div>
        </div>
        <div className="card">
          <div className="card-title">Your Travel Info</div>
          <div className="form-group"><label className="form-label">Travelling From</label><input className="form-input" placeholder="Mumbai" value={fromCity} onChange={e => setFromCity(e.target.value)} /></div>
          <div className="form-group"><label className="form-label">Mode of Transport</label>
            <select className="form-input" value={transport} onChange={e => setTransport(e.target.value)}>
              <option value="flight">✈️ Flight</option><option value="train">🚂 Train</option><option value="bus">🚌 Bus</option><option value="car">🚗 Car</option>
            </select>

        </div>
        <button className="btn btn-primary" onClick={createTrip} disabled={loading}>{loading ? '⏳ Creating…' : '🚀 Create Trip & Get Invite Link'}</button>
        <div style={{height:12}}/>
        <button className="btn btn-outline" onClick={() => setScr('dashboard')}>Cancel</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   JOIN TRIP SCREEN
══════════════════════════════════════════ */
function JoinTripScreen({ session, profile, setScr, loadTrips }) {
  const [code, setCode] = useState('');
  const [fromCity, setFromCity] = useState('');
  const [transport, setTransport] = useState('flight');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [found, setFound] = useState(null);

  async function lookupCode() {
    if (code.length < 4) return;
    const { data } = await sb.from('trips').select('*').eq('invite_code', code.toUpperCase()).single();
    setFound(data || null);
    if (!data) setErr('No trip found with this code.');
    else setErr('');
  }

  async function joinTrip() {
    if (!found) return;
    setLoading(true);
    const uid = session.user.id;
    const { error } = await sb.from('trip_members').upsert({ trip_id:found.id, user_id:uid, role:'member', from_city:fromCity||'Your City', transport_mode:transport, progress:0 }, { onConflict:'trip_id,user_id' });
    if (error) { setErr(error.message); setLoading(false); return; }
    await loadTrips(uid);
    setLoading(false);
    setScr('dashboard');
  }

  return (
    <div>
      <div className="back-nav">
        <button className="back-btn" onClick={() => setScr('dashboard')}>←</button>
        <div className="back-title">Join a Trip 🔗</div>
        <div style={{width:30}}/>
      </div>
      <div className="mobile-wrap screen-inner" style={{paddingBottom:20}}>
        {err && <div className="err-msg">{err}</div>}
        <div className="card">
          <div className="card-title">Enter Invite Code</div>
          <div className="form-group"><input className="form-input join-input" placeholder="ABC12345" maxLength={8} value={code} onChange={e => { setCode(e.target.value.toUpperCase()); setFound(null); }} onBlur={lookupCode} /></div>
          {found && <div style={{background:'#F0FFF4',border:'1.5px solid #86EFAC',borderRadius:10,padding:12,marginBottom:12}}><div style={{fontSize:13,color:'var(--muted)'}}>Trip found! ✅</div><div style={{fontSize:17,fontWeight:800,color:'var(--navy)'}}>{found.destination}</div><div style={{fontSize:13,color:'var(--muted)'}}>{found.name}</div></div>}
          <div className="form-group"><label className="form-label">Travelling From</label><input className="form-input" placeholder="Delhi" value={fromCity} onChange={e => setFromCity(e.target.value)} /></div>
          <div className="form-group"><label className="form-label">Mode of Transport</label>
            <select className="form-input" value={transport} onChange={e => setTransport(e.target.value)}>
              <option value="flight">✈️ Flight</option><option value="train">🚂 Train</option><option value="bus">🚌 Bus</option><option value="car">🚗 Car</option>
            </select>
          </div>
          <button className="btn btn-primary" onClick={found ? joinTrip : lookupCode} disabled={loading}>{loading ? '⏳ Joining…' : found ? '✅ Join Trip' : '🔍 Find Trip'}</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   TRACKER SCREEN — real GPS + Leaflet map
══════════════════════════════════════════ */
function TrackerScreen({ trip, members: initialMembers, session, profile, loadTripData }) {
  const [members, setMembers] = useState(initialMembers);
  const [myProgress, setMyProgress] = useState(0);
  const [saving, setSaving] = useState(false);
  const [gpsStatus, setGpsStatus] = useState('pending'); // 'pending'|'active'|'denied'
  const [myCoords, setMyCoords] = useState(null);
  const [destCoords, setDestCoords] = useState(null);
  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const markers = useRef({});
  const destMarker = useRef(null);
  const watchId = useRef(null);
  const pollTimer = useRef(null);

  const uid = session?.user?.id;
  const transIcons = { flight:'✈️', train:'🚂', bus:'🚌', car:'🚗' };

  /* ── Init progress ── */
  useEffect(() => {
    const me = members.find(m => m.user_id === uid);
    if (me) setMyProgress(me.progress || 0);
  }, []);

  /* ── Geocode destination → lat/lng ── */
  useEffect(() => {
    async function geocode() {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(trip.destination)}&format=json&limit=1`);
        const d = await r.json();
        if (d[0]) setDestCoords({ lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) });
      } catch(e) {
        // Fallback: centre of India
        setDestCoords({ lat: 20.5937, lng: 78.9629 });
      }
    }
    geocode();
  }, [trip.destination]);

  /* ── Init Leaflet map once destCoords ready ── */
  useEffect(() => {
    if (!destCoords || leafletMap.current) return;
    const map = L.map('tracker-map', { zoomControl: true, attributionControl: true })
      .setView([destCoords.lat, destCoords.lng], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
      maxZoom: 18,
    }).addTo(map);

    // Destination marker
    const destIcon = L.divIcon({
      html: `<div class="lf-dest-marker">📍 ${trip.destination}</div>`,
      className: '', iconAnchor: [0, 0]
    });
    destMarker.current = L.marker([destCoords.lat, destCoords.lng], { icon: destIcon }).addTo(map);

    leafletMap.current = map;
    updateMarkers(members, map);
  }, [destCoords]);

  /* ── Update markers whenever members change ── */
  useEffect(() => {
    if (leafletMap.current) updateMarkers(members, leafletMap.current);
  }, [members]);

  function updateMarkers(mems, map) {
    mems.forEach((m, i) => {
      if (!m.lat || !m.lng) return;
      const color = m.profiles?.avatar_color || COLORS[i % COLORS.length];
      const label = initials(m.profiles?.name || '?');
      const name = m.profiles?.name || 'Unknown';
      const seenAgo = m.last_seen ? timeSince(new Date(m.last_seen)) : 'unknown';

      if (markers.current[m.user_id]) {
        markers.current[m.user_id].setLatLng([m.lat, m.lng]);
        markers.current[m.user_id].getPopup()?.setContent(`<b>${name}</b><br>📍 Live<br>⏱ ${seenAgo}`);
      } else {
        const icon = L.divIcon({
          html: `<div class="lf-avatar-marker" style="background:${color}">${label}</div>`,
          className: '', iconSize: [36, 36], iconAnchor: [18, 18]
        });
        markers.current[m.user_id] = L.marker([m.lat, m.lng], { icon })
          .addTo(map)
          .bindPopup(`<b>${name}</b><br>📍 Live<br>⏱ ${seenAgo}`);
      }
    });
  }

  function timeSince(date) {
    const s = Math.floor((Date.now() - date) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s/60)}m ago`;
    return `${Math.floor(s/3600)}h ago`;
  }

  /* ── GPS watch ── */
  useEffect(() => {
    if (!navigator.geolocation) { setGpsStatus('denied'); return; }
    watchId.current = navigator.geolocation.watchPosition(
      pos => {
        const { latitude: lat, longitude: lng } = pos.coords;
        setGpsStatus('active');
        setMyCoords({ lat, lng });
        saveMyLocation(lat, lng);
        // Pan map to my location on first fix
        if (leafletMap.current) leafletMap.current.setView([lat, lng], 14);
      },
      err => setGpsStatus('denied'),
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
    );
    return () => { if (watchId.current) navigator.geolocation.clearWatch(watchId.current); };
  }, []);

  /* ── Poll member locations every 10s ── */
  useEffect(() => {
    async function pollMembers() {
      const { data } = await sb.from('trip_members').select('*, profiles(*)').eq('trip_id', trip.id);
      if (data) setMembers(data);
    }
    pollTimer.current = setInterval(pollMembers, 10000);
    return () => clearInterval(pollTimer.current);
  }, [trip.id]);

  /* ── Cleanup map on unmount ── */
  useEffect(() => {
    return () => {
      if (leafletMap.current) { leafletMap.current.remove(); leafletMap.current = null; }
      markers.current = {};
    };
  }, []);

  async function saveMyLocation(lat, lng) {
    await sb.from('trip_members')
      .update({ lat, lng, last_seen: new Date().toISOString() })
      .eq('trip_id', trip.id)
      .eq('user_id', uid);
  }

  async function updateProgress(val) {
    setMyProgress(val); setSaving(true);
    await sb.from('trip_members').update({ progress: val }).eq('trip_id', trip.id).eq('user_id', uid);
    setSaving(false);
  }

  const membersWithGps = members.filter(m => m.lat && m.lng);

  return (
    <>
      {/* GPS status bar */}
      <div className="gps-status">
        <div className={'gps-dot ' + gpsStatus}/>
        {gpsStatus === 'active' && <span style={{color:'var(--green)',fontWeight:600}}>📡 GPS Active — sharing location</span>}
        {gpsStatus === 'denied' && <span style={{color:'var(--red)'}}>📵 GPS denied — enable in browser settings</span>}
        {gpsStatus === 'pending' && <span style={{color:'var(--orange)'}}>⏳ Requesting GPS…</span>}
        {membersWithGps.length > 0 && <span style={{marginLeft:'auto',color:'var(--muted)',fontSize:12}}>{membersWithGps.length} live on map</span>}
      </div>

      {/* Leaflet map */}
      <div id="tracker-map" />

      {/* Progress slider */}
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div className="card-title" style={{margin:0}}>My Journey Progress</div>
          {saving && <span style={{fontSize:12,color:'var(--muted)'}}>Saving…</span>}
        </div>
        <input type="range" min="0" max="100" value={myProgress}
          onChange={e => updateProgress(Number(e.target.value))}
          style={{width:'100%',accentColor:'var(--orange)'}}/>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--muted)',marginTop:4}}>
          <span>🏠 Start</span>
          <span style={{color:'var(--orange)',fontWeight:700}}>{myProgress}% done</span>
          <span>📍 {trip.destination}</span>
        </div>
      </div>

      {/* Member list */}
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div className="card-title" style={{margin:0}}>Group ({members.length})</div>
          <span style={{fontSize:12,color:'var(--muted)'}}>Updates every 10s</span>
        </div>
        {members.map((m, i) => (
          <div key={m.id} className="member-row">
            <div style={{width:40,height:40,borderRadius:'50%',background:m.profiles?.avatar_color||COLORS[i%COLORS.length],display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,color:'#fff',flexShrink:0}}>
              {initials(m.profiles?.name||'?')}
            </div>
            <div className="m-info">
              <div className="m-name">{m.profiles?.name||'Unknown'}</div>
              <div className="m-city">
                {transIcons[m.transport_mode]||'✈️'} from {m.from_city}
                {m.lat && m.lng
                  ? <span style={{color:'var(--green)',marginLeft:6,fontWeight:600}}>📡 Live{m.last_seen ? ' · '+timeSince(new Date(m.last_seen)) : ''}</span>
                  : <span style={{color:'var(--muted)',marginLeft:6}}>No GPS</span>
                }
              </div>
              <div className="prog-bar"><div className="prog-fill" style={{width:(m.progress||0)+'%'}}/></div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <span className={'m-role '+m.role}>{m.role==='coordinator'?'👑 Host':'👤 Member'}</span>
              <div style={{fontSize:12,color:'var(--orange)',fontWeight:700,marginTop:4}}>{m.progress||0}%</div>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

function CostScreen({ trip, members, expenses, setExpenses, session, profile, showAddExp, setShowAddExp, sendNotifications }) {

          <div className="form-group"><label className="form-label">Total Amount (₹)</label><input className="form-input" placeholder="5000" type="number" value={amount} onChange={e => setAmount(e.target.value)} /></div>
          {members.length>0 && amount && <div style={{background:'#FFF3E0',borderRadius:8,padding:'8px 12px',fontSize:13,color:'var(--orange)',fontWeight:600,marginBottom:10}}>= {fmtCurrency(Math.round(Number(amount)/members.length))} per person</div>}
          <button className="btn btn-green" onClick={addExpense} disabled={loading}>{loading ? '⏳ Saving…' : '✅ Add Expense'}</button>
        </div>

      {expenses.length===0 ? <div className="empty-state" style={{padding:'24px 0'}}><div className="empty-icon">💸</div><div className="empty-sub">No expenses yet. Add your first one!</div></div>

      }

        <div className="card"><div className="card-title">Balance Sheet</div>
          {members.map((m,i) => {
            const paid = expenses.filter(e => e.paid_by===m.user_id).reduce((s,e) => s+Number(e.amount),0);
            const owes = perPerson - paid;
            return (<div key={m.id} className="member-row">
              <div style={{width:36,height:36,borderRadius:'50%',background:m.profiles?.avatar_color||COLORS[i%COLORS.length],display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#fff'}}>{initials(m.profiles?.name||'?')}</div>
              <div className="m-info"><div className="m-name">{m.profiles?.name||'Unknown'}</div><div className="m-city">Paid: {fmtCurrency(paid)}</div></div>

                  <div>

                      <div className="pay-apps" style={{justifyContent:'flex-end'}}>

              </div>

  );

function AiChatScreen({ trip }) {
  const [messages, setMessages] = useState([{role:'ai',text:`Hi! 👋 I'm your SafarNama AI assistant. I can help you plan your trip to ${trip.destination}. Ask me anything — budget, places, hotels, best time to go!`}]);
  const [input, setInput] = useState('');
  const [thinking, setThinking] = useState(false);
  const endRef = useRef(null);
  async function send() {
    if (!input.trim() || thinking) return;
    const q = input.trim();
    setMessages(prev => [...prev, {role:'user',text:q}]);
    setInput(''); setThinking(true);
    const prompt = `You are SafarNama AI, a helpful Indian travel assistant. The user is planning a group trip to "${trip.destination}". Answer this question concisely in 100 words max using emojis where relevant:\n\nUser: ${q}`;
    try {
      const reply = await callGemini(prompt);
      setMessages(prev => [...prev, {role:'ai',text:reply}]);
    } catch(e) {
      const fallbackKey = Object.keys(AI_RESPONSES).find(k => q.toLowerCase().includes(k));
      const fallback = e.message==='NO_KEY'
        ? `⚠️ Add your Gemini API key in Profile → AI Settings for real AI answers!\n\n${fallbackKey ? AI_RESPONSES[fallbackKey] : `Here's a tip about ${trip.destination}: check local weather, book early, and explore street food! 🌍`}`
        : `⚠️ AI error: ${e.message}`;
      setMessages(prev => [...prev, {role:'ai',text:fallback}]);
    }
    setThinking(false);
    setTimeout(() => endRef.current?.scrollIntoView({behavior:'smooth'}), 100);
  }
  return (
    <>
      <div className="chat-area">
        {messages.map((m,i) => <div key={i} className={'chat-bubble chat-'+(m.role==='ai'?'ai':'user')}>{m.text}</div>)}
        {thinking && <div className="chat-bubble chat-ai" style={{opacity:.6}}>⏳ Thinking…</div>}
        <div ref={endRef}/>
      </div>
      <div className="chat-input-row">
        <input className="chat-input" placeholder="Ask about budget, hotels, places…" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==='Enter' && send()} />
        <button className="chat-send" onClick={send}>➤</button>
      </div>
      <div style={{marginTop:10,display:'flex',gap:8,flexWrap:'wrap'}}>
        {['budget','best time','places','hotel','transport'].map(q => <button key={q} className="chip" style={{cursor:'pointer'}} onClick={() => setInput(q)}>{q}</button>)}
      </div>
    </>
  );
}

/* ══════════════════════════════════════════
   NOTIFICATION BELL
══════════════════════════════════════════ */
function NotificationBell({ notifications, session, markAllRead }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const unread = (notifications || []).filter(n => !n.read).length;

  useEffect(() => {
    function handleClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handleClick);
    return () => document.removeEventListener('mousedown', handleClick);
  }, []);

  function toggle() {
    setOpen(o => !o);
    if (!open && unread > 0 && session?.user?.id) markAllRead(session.user.id);
  }

  function timeAgo(ts) {
    const s = Math.floor((Date.now() - new Date(ts)) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s/60)}m ago`;
    if (s < 86400) return `${Math.floor(s/3600)}h ago`;
    return `${Math.floor(s/86400)}d ago`;
  }

  return (
    <div style={{position:'relative'}} ref={ref}>
      <button className="notif-bell" onClick={toggle} title="Notifications">
        🔔
        {unread > 0 && <span className="notif-badge">{unread > 9 ? '9+' : unread}</span>}
      </button>
      {open && (
        <div className="notif-dropdown">
          <div className="notif-header">
            <span>Notifications</span>
            {unread > 0 && <span style={{fontSize:11,color:'var(--teal)',fontWeight:600,cursor:'pointer'}}>Mark all read</span>}
          </div>
          {(!notifications || notifications.length === 0) ? (
            <div className="notif-empty">🔔 No notifications yet</div>
          ) : (
            notifications.slice(0, 8).map(n => (
              <div key={n.id} className={'notif-item' + (n.read ? '' : ' unread')}>
                <div className="notif-msg">{n.message}</div>
                <div className="notif-time">{timeAgo(n.created_at)}</div>
              </div>
            ))
          )}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   VOTING SCREEN
══════════════════════════════════════════ */
function VotingScreen({ trip, members, session, sendNotifications }) {
  const [votes, setVotes] = useState([]);
  const [myVotes, setMyVotes] = useState({});
  const [loading, setLoading] = useState(true);
  const [consensus, setConsensus] = useState('');
  const [generating, setGenerating] = useState(false);
  const uid = session?.user?.id;

  const categories = [
    { id: 'destination', label: '📍 Destination options', options: [`${trip.destination}`, 'Goa, India', 'Manali, Himachal Pradesh', 'Pondicherry', 'Coorg, Karnataka'] },
    { id: 'transport', label: '🚗 How do we travel?', options: ['✈️ Flight', '🚂 Train', '🚌 Bus', '🚗 Self-drive'] },
    { id: 'hotel', label: '🏨 Where do we stay?', options: ['Budget guesthouse (₹500-1000/night)', 'Mid-range hotel (₹1500-3000/night)', 'Premium resort (₹4000+/night)', 'Airbnb/Villa'] },
    { id: 'dates', label: '📅 When do we go?', options: [trip.start_date ? `Planned: ${trip.start_date}` : 'This weekend', 'Next weekend', 'Next month', 'Flexible — whenever works'] },
  ];

  useEffect(() => { loadVotes(); }, [trip.id]);

  async function loadVotes() {
    setLoading(true);
    const { data } = await sb.from('trip_votes').select('*').eq('trip_id', trip.id);
    if (data) {
      setVotes(data);
      const mine = {};
      data.filter(v => v.user_id === uid).forEach(v => { mine[v.category] = v.option_text; });
      setMyVotes(mine);
    }
    setLoading(false);
  }

  async function castVote(category, option) {
    const prev = myVotes[category];
    setMyVotes(m => ({ ...m, [category]: option }));
    const { data } = await sb.from('trip_votes').upsert(
      { trip_id: trip.id, user_id: uid, category, option_text: option },
      { onConflict: 'trip_id,user_id,category' }
    ).select();
    await loadVotes();
    if (prev !== option) {
      const myName = members.find(m => m.user_id === uid)?.profiles?.name || 'Someone';
      await sendNotifications(trip.id, members, uid, `${myName} voted for "${option}" in ${trip.destination} trip`);
    }
  }

  async function getAIConsensus() {
    setGenerating(true); setConsensus('');
    const summary = categories.map(cat => {
      const catVotes = votes.filter(v => v.category === cat.id);
      const tally = {};
      catVotes.forEach(v => { tally[v.option_text] = (tally[v.option_text] || 0) + 1; });
      const top = Object.entries(tally).sort((a,b) => b[1]-a[1]).slice(0,3).map(([o,c]) => `${o} (${c} votes)`).join(', ');
      return `${cat.label}: ${top || 'No votes yet'}`;
    }).join('\n');

    const prompt = `You are SafarNama AI. A group is voting on a trip to ${trip.destination} with ${members.length} members. Here are the vote results:\n\n${summary}\n\nGive a friendly AI recommendation for the best overall choice for the group. Be concise (under 120 words), mention the winning option in each category, and add a practical tip. Use emojis.`;
    try {
      const reply = await callGemini(prompt);
      setConsensus(reply);
    } catch(e) {
      setConsensus(e.message === 'NO_KEY' ? '⚠️ Add Gemini API key in Profile → AI Settings to get AI consensus.' : `⚠️ ${e.message}`);
    }
    setGenerating(false);
  }

  function votesForOption(category, option) {
    return votes.filter(v => v.category === category && v.option_text === option).length;
  }
  const totalMembers = members.length || 1;

  if (loading) return <div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Loading votes…</div>;

  return (
    <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div className="sec-title">🗳️ Group Vote</div>
        <span className="chip">{members.length} voters</span>
      </div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:16}}>Tap to cast your vote. Results update live for the whole group.</div>

      {categories.map(cat => (
        <div key={cat.id} className="vote-category">
          <div className="vote-cat-title">{cat.label}</div>
          <div className="vote-options">
            {cat.options.map(opt => {
              const count = votesForOption(cat.id, opt);
              const pct = Math.round((count / totalMembers) * 100);
              const isMyVote = myVotes[cat.id] === opt;
              return (
                <button key={opt} className={'vote-option' + (isMyVote ? ' selected' : '')} onClick={() => castVote(cat.id, opt)}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:4,flex:1}}>
                    <span>{opt}</span>
                    {count > 0 && (
                      <div style={{display:'flex',alignItems:'center',gap:6,width:'100%'}}>
                        <div className="vote-bar-outer"><div className="vote-bar-inner" style={{width:pct+'%'}}/></div>
                        <span className="vote-tally">{count}/{totalMembers}</span>
                      </div>
                    )}
                  </div>
                  {isMyVote && <span style={{fontSize:16,marginLeft:8}}>✅</span>}
                </button>
              );
            })}
          </div>
        </div>
      ))}

      {consensus && (
        <div className="consensus-box">
          <div className="consensus-title">🤖 AI Consensus Pick</div>
          <div className="consensus-text">{consensus}</div>
        </div>
      )}

      <button className="btn btn-primary" onClick={getAIConsensus} disabled={generating} style={{marginBottom:12}}>
        {generating ? '⏳ AI is thinking…' : '🤖 Get AI Consensus'}
      </button>
      <div style={{fontSize:12,color:'var(--muted)',textAlign:'center'}}>AI analyses all votes and recommends the best option for your group</div>
    </>
  );
}

/* ══════════════════════════════════════════
   ITINERARY SCREEN
══════════════════════════════════════════ */
function ItineraryScreen({ trip, members }) {
  const [itinerary, setItinerary] = useState(null);
  const [loading, setLoading] = useState(true);
  const [generating, setGenerating] = useState(false);

  useEffect(() => { loadItinerary(); }, [trip.id]);

  async function loadItinerary() {
    setLoading(true);
    const { data } = await sb.from('itineraries').select('*').eq('trip_id', trip.id).single();
    if (data) setItinerary(data.content);
    setLoading(false);
  }

  async function generateItinerary() {
    setGenerating(true);
    const days = trip.start_date && trip.end_date
      ? Math.max(1, Math.round((new Date(trip.end_date) - new Date(trip.start_date)) / 86400000) + 1)
      : 4;
    const prompt = `You are SafarNama AI, an expert Indian travel planner. Create a detailed ${days}-day itinerary for a group of ${members.length} people going to ${trip.destination}${trip.start_date ? ` from ${trip.start_date} to ${trip.end_date}` : ''}.\n\nFormat EXACTLY like this for each day:\nDAY 1: [Theme/Title]\n08:00 - [Morning activity]\n12:00 - [Lunch suggestion with restaurant name]\n14:00 - [Afternoon activity]\n19:00 - [Dinner suggestion]\n21:00 - [Evening activity]\n\nInclude practical tips, estimated costs in INR, and local food recommendations. Keep each activity description to 1-2 sentences. Make it realistic and fun for a group!`;
    try {
      const reply = await callGemini(prompt);
      // Save to DB
      await sb.from('itineraries').upsert({ trip_id: trip.id, content: reply, generated_at: new Date().toISOString() }, { onConflict: 'trip_id' });
      setItinerary(reply);
    } catch(e) {
      setItinerary(e.message === 'NO_KEY' ? '⚠️ Add your Gemini API key in Profile → AI Settings to generate itinerary.' : `⚠️ Error: ${e.message}`);
    }
    setGenerating(false);
  }

  function parseItinerary(text) {
    if (!text || text.startsWith('⚠️')) return null;
    const days = text.split(/DAY \d+:/i).filter(Boolean);
    return days.map((day, i) => {
      const lines = day.trim().split('\n').filter(Boolean);
      const title = lines[0];
      const activities = lines.slice(1).map(l => {
        const match = l.match(/^(\d{1,2}:\d{2})\s*[-–]\s*(.+)/);
        return match ? { time: match[1], desc: match[2] } : { time: '', desc: l };
      });
      return { day: i + 1, title, activities };
    });
  }

  const parsed = itinerary ? parseItinerary(itinerary) : null;

  if (loading) return <div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Loading itinerary…</div>;

  return (
    <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div className="sec-title">📋 Trip Itinerary</div>
        <button className="btn btn-primary btn-sm" onClick={generateItinerary} disabled={generating}>
          {generating ? '⏳' : itinerary ? '🔄 Regenerate' : '✨ Generate'}
        </button>
      </div>

      {!itinerary && !generating && (
        <div className="empty-state" style={{padding:'32px 0'}}>
          <div className="empty-icon">📋</div>
          <div className="empty-title">No itinerary yet</div>
          <div className="empty-sub">Tap Generate to create an AI day-by-day plan for {trip.destination}</div>
          <button className="btn btn-primary" style={{maxWidth:240,margin:'0 auto'}} onClick={generateItinerary}>✨ Generate AI Itinerary</button>
        </div>
      )}

      {generating && (
        <div style={{textAlign:'center',padding:40}}>
          <div style={{fontSize:40,marginBottom:12}}>🤖</div>
          <div style={{color:'var(--teal)',fontWeight:700}}>AI is planning your trip…</div>
          <div style={{fontSize:13,color:'var(--muted)',marginTop:6}}>This takes about 10 seconds</div>
        </div>
      )}

      {itinerary && itinerary.startsWith('⚠️') && (
        <div className="err-msg">{itinerary}</div>
      )}

      {parsed && parsed.map(d => (
        <div key={d.day} className="itin-day">
          <div className="itin-day-header">
            <div className="itin-day-num">D{d.day}</div>
            <div className="itin-day-title">{d.title}</div>
          </div>
          {d.activities.map((a, i) => (
            <div key={i} className="itin-activity">
              {a.time && <div className="itin-time">{a.time}</div>}
              <div className="itin-desc">{a.desc}</div>
            </div>
          ))}
        </div>
      ))}

      {itinerary && !parsed && !itinerary.startsWith('⚠️') && (
        <div className="card"><div style={{fontSize:14,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{itinerary}</div></div>
      )}
    </>
  );
}

            <div className="card" style={{padding:'0 4px'}}>
              <div className="admin-table-wrap"><table className="admin-table"><thead><tr><th>Name</th><th>Phone</th><th>Trips</th><th>Joined</th></tr></thead><tbody>
                {users.length===0 && <tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:16}}>No users yet</td></tr>}
                {users.map((u,i) => <tr key={u.id}><td><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:26,height:26,borderRadius:'50%',background:u.avatar_color||COLORS[i%COLORS.length],display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff',flexShrink:0}}>{initials(u.name)}</div><span style={{fontWeight:600,fontSize:13}}>{u.name}</span></div></td><td style={{color:'var(--muted)'}}>{u.phone||'—'}</td><td><span style={{background:'#EFF6FF',color:'var(--navy)',padding:'2px 8px',borderRadius:8,fontSize:11,fontWeight:700}}>{u.tripCount}</span></td><td style={{color:'var(--muted)',fontSize:11}}>{new Date(u.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</td></tr>)}
              </tbody></table></div>
            </div>
            <div className="admin-section">✈️ Trips ({allTrips.length})</div>
            <div className="card" style={{padding:'0 4px'}}>
              <div className="admin-table-wrap"><table className="admin-table"><thead><tr><th>Destination</th><th>Code</th><th>👥</th><th>Spend</th></tr></thead><tbody>
                {allTrips.length===0 && <tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:16}}>No trips yet</td></tr>}
                {allTrips.map(t => <tr key={t.id}><td><span style={{fontWeight:700}}>📍 {t.destination}</span><div style={{fontSize:10,color:'var(--muted)'}}>{t.name}</div></td><td><code style={{background:'#F0F2F8',padding:'2px 6px',borderRadius:4,fontSize:11,fontWeight:700,letterSpacing:1}}>{t.invite_code}</code></td><td style={{fontWeight:700,color:'var(--navy)'}}>{t.memberCount}</td><td style={{color:'var(--green)',fontWeight:700,fontSize:12}}>{fmtCurrency(t.spend)}</td></tr>)}
              </tbody></table></div>
            </div>
            <div className="admin-section">💸 Recent Expenses</div>
            <div className="card" style={{padding:'0 4px'}}>
              <div className="admin-table-wrap"><table className="admin-table"><thead><tr><th>Item</th><th>Trip</th><th>By</th><th>₹</th></tr></thead><tbody>
                {exps.length===0 && <tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:16}}>No expenses yet</td></tr>}
                {exps.map((e,i) => <tr key={e.id||i}><td style={{fontWeight:600}}>{e.title}</td><td style={{color:'var(--muted)',fontSize:11}}>{e.trips?.destination||'—'}</td><td style={{fontSize:11}}>{e.profiles?.name||'—'}</td><td style={{color:'var(--orange)',fontWeight:800}}>{fmtCurrency(e.amount)}</td></tr>)}
              </tbody></table></div>
            </div>
            <div style={{textAlign:'center',marginTop:12,fontSize:12,color:'var(--muted)'}}>For full charts open safarnama_analytics.html</div>
          </>
        )}
      </div>
    </div>
  );
}

/* ── Mount ── */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
